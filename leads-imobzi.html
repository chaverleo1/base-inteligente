<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Todos os Leads Imobzi — BASE INTELIGENTE</title>
<script src="config.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap');

:root {
  --bg:#0f1117; --surface:#181c27; --surface2:#1e2335; --surface3:#242840;
  --border:#2a3050; --border2:#343d60; --accent:#4f7cff; --accent2:#00d4aa;
  --text:#e8ecf4; --text2:#8892aa; --text3:#4a5470;
  --radius:12px; --radius-sm:8px; --radius-xs:6px;
  --hot:#ff5a5a; --warm:#f5a623; --cold:#4f7cff; --danger:#ff5a5a;
}
* { box-sizing:border-box; margin:0; padding:0; }
body { background:var(--bg); color:var(--text); font-family:'Inter',sans-serif; font-size:14px; min-height:100vh; }
a { text-decoration:none; color:inherit; }

.header {
  background:var(--surface); border-bottom:1px solid var(--border);
  padding:14px 24px; display:flex; align-items:center; justify-content:space-between;
  position:sticky; top:0; z-index:100;
}
.logo { font-family:'Space Grotesk',sans-serif; font-size:15px; font-weight:700; color:var(--accent); letter-spacing:-.3px; flex-shrink:0; }
.logo span { color:var(--text2); font-weight:400; }
.nav-tabs { display:flex; background:var(--bg); border-radius:8px; padding:3px; gap:2px;
            overflow-x:auto; -webkit-overflow-scrolling:touch; scrollbar-width:none; min-width:0; }
.nav-tabs::-webkit-scrollbar { display:none; }
.nav-tab { padding:6px 16px; border-radius:6px; border:none; background:transparent; color:var(--text2);
           font-size:13px; font-weight:500; cursor:pointer; transition:all .2s; font-family:'Inter',sans-serif;
           text-decoration:none; display:inline-block; flex-shrink:0; }
.nav-tab:hover { color:var(--text); }
.nav-tab.active { background:var(--accent); color:#fff; }
.refresh-btn { background:transparent; border:1px solid var(--border); border-radius:8px; color:var(--text2);
               padding:6px 14px; font-size:13px; cursor:pointer; font-family:'Inter',sans-serif; transition:all .2s; flex-shrink:0; }
.refresh-btn:hover { border-color:var(--accent); color:var(--accent); }
@media (max-width:640px) {
  .header { padding:12px 14px; gap:8px; }
  .logo { font-size:13px; }
  .nav-tab { padding:6px 11px; font-size:12px; }
  .container { padding:20px 14px; }
}

.container { max-width:900px; margin:0 auto; padding:28px 24px; }

.page-header { display:flex; align-items:center; justify-content:space-between; gap:14px; margin-bottom:20px; flex-wrap:wrap; }
.page-title { font-family:'Space Grotesk',sans-serif; font-size:22px; font-weight:700; }
.page-sub { font-size:13px; color:var(--text3); margin-top:3px; }

.filtro-bar { display:flex; gap:6px; flex-wrap:wrap; margin-bottom:16px; }
.filtro-chip {
  padding:5px 12px; border-radius:99px; border:1px solid var(--border);
  background:var(--surface2); color:var(--text2); font-size:12px; font-weight:500;
  cursor:pointer; transition:all .15s; font-family:'Inter',sans-serif;
}
.filtro-chip.on { background:rgba(79,124,255,.15); border-color:var(--accent); color:var(--accent); }
.filtro-chip:hover { border-color:var(--border2); color:var(--text); }

.search-bar {
  background:var(--surface); border:1px solid var(--border); border-radius:var(--radius);
  padding:12px 16px; display:flex; align-items:center; gap:10px; margin-bottom:20px;
}
.search-bar input { background:transparent; border:none; color:var(--text); font-size:14px; font-family:'Inter',sans-serif; width:100%; outline:none; }
.search-icon { color:var(--text3); font-size:15px; }

.bi-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:18px 20px;display:flex;align-items:flex-start;gap:16px;transition:border-color .2s}
.bi-card:hover{border-color:var(--accent)}
.bi-card+.bi-card{margin-top:10px}
.bi-avatar{width:40px;height:40px;border-radius:50%;background:rgba(79,124,255,.2);border:2px solid var(--accent);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:16px;color:var(--accent);flex-shrink:0}
.bi-info{flex:1;min-width:0}
.bi-name{font-family:'Space Grotesk',sans-serif;font-size:15px;font-weight:700;color:var(--text)}
.bi-sub{font-size:12px;color:var(--text2);margin-top:2px}
.bi-actions{display:flex;flex-direction:column;gap:8px;flex-shrink:0}
.bi-btn{padding:8px 14px;border-radius:8px;font-size:12px;font-weight:600;cursor:pointer;border:none;font-family:'Inter',sans-serif;white-space:nowrap;transition:all .2s;text-decoration:none;display:inline-block;text-align:center}
.bi-empty{text-align:center;padding:48px;color:var(--text3);font-size:14px}

.status-badge{font-size:9px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:2px 7px;border-radius:99px;display:inline-block;margin-left:6px;vertical-align:middle}

/* ── DRAWER (mesmo padrão do resto do projeto) ── */
.drawer-overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:500;opacity:0;pointer-events:none;transition:opacity .25s}
.drawer-overlay.open{opacity:1;pointer-events:all}
.drawer{position:fixed;top:0;right:0;height:100vh;width:480px;max-width:100vw;background:var(--surface);
        border-left:1px solid var(--border);z-index:501;transform:translateX(100%);
        transition:transform .3s;overflow-y:auto;display:flex;flex-direction:column}
.drawer.open{transform:translateX(0)}
.drawer-header{padding:20px 24px 16px;border-bottom:1px solid var(--border);display:flex;align-items:flex-start;gap:14px;position:sticky;top:0;background:var(--surface);z-index:1}
.drawer-nome{font-family:'Space Grotesk',sans-serif;font-size:18px;font-weight:700;color:var(--text);line-height:1.2}
.drawer-cod{font-size:12px;color:var(--text3);margin-top:2px}
.drawer-close{margin-left:auto;background:transparent;border:none;color:var(--text3);font-size:22px;cursor:pointer;padding:0 4px;line-height:1}
.drawer-close:hover{color:var(--text)}
.drawer-body{padding:20px 24px;flex:1}
.link-form-group{display:flex;flex-direction:column;gap:5px;margin-bottom:14px}
.link-form-label{font-size:10px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.6px}
.link-form-input{background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius-sm);
                  color:var(--text);font-size:13px;font-family:'Inter',sans-serif;padding:9px 12px;
                  outline:none;transition:border .2s;width:100%}
.link-form-input:focus{border-color:var(--accent)}
.btn-salvar-drawer{background:var(--accent2);color:#0f1117;border:none;border-radius:var(--radius-sm);
                    padding:11px 14px;font-size:13px;font-weight:700;cursor:pointer;font-family:'Inter',sans-serif;
                    width:100%;transition:all .2s}
.btn-salvar-drawer:hover{background:#00bfa0}
.btn-salvar-drawer:disabled{opacity:.5;cursor:default}

.toast{position:fixed;top:72px;left:50%;transform:translateX(-50%) translateY(-20px);padding:12px 24px;border-radius:99px;font-weight:600;font-size:14px;opacity:0;transition:all .3s;z-index:9999;white-space:nowrap}
.toast.ok{background:var(--accent2);color:#0f1117}
.toast.erro{background:var(--danger);color:#fff}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>

<div class="toast" id="toast"></div>

<div class="header">
  <div class="logo">BASE <span>INTELIGENTE</span></div>
  <div class="nav-tabs">
    <a href="contatos.html"    class="nav-tab">Contatos</a>
    <a href="dashboard.html"   class="nav-tab">Dashboard</a>
    <a href="busca.html"       class="nav-tab">Busca Aberta</a>
    <a href="lancamentos.html" class="nav-tab">Lançamentos</a>
    <a href="dashboard.html?secao=baseimob"   class="nav-tab">BaseImob</a>
    <a href="leads-imobzi.html"   class="nav-tab active">Leads Imobzi</a>
    <a href="dashboard.html?secao=adm"   class="nav-tab">ADM</a>
  </div>
  <button class="refresh-btn" onclick="window.location.href='dashboard.html'">← Voltar ao Dashboard</button>
</div>

<div class="container">
  <div class="page-header">
    <div>
      <div class="page-title">Todos os Leads Imobzi</div>
      <div class="page-sub">Base própria, separada de Contatos — pendentes, já migrados e re-leads.</div>
    </div>
  </div>

  <div class="filtro-bar" id="filtroBar">
    <button class="filtro-chip on" data-f="todos" onclick="mudarFiltro('todos')">Todos</button>
    <button class="filtro-chip" data-f="pendentes" onclick="mudarFiltro('pendentes')">Pendentes</button>
    <button class="filtro-chip" data-f="relead" onclick="mudarFiltro('relead')">Re-lead</button>
    <button class="filtro-chip" data-f="migrados" onclick="mudarFiltro('migrados')">Migrados</button>
  </div>

  <div class="search-bar">
    <span class="search-icon">🔍</span>
    <input type="text" id="searchInput" placeholder="Buscar por nome, telefone, email ou código do imóvel..." oninput="renderLista()">
  </div>

  <div id="root"><div class="bi-empty">Carregando leads...</div></div>
</div>

<!-- DRAWER EDITAR LEAD -->
<div class="drawer-overlay" id="drawerOverlay" onclick="fecharDrawer()"></div>
<div class="drawer" id="drawer">
  <div class="drawer-header">
    <div>
      <div class="drawer-nome" id="drawerTitulo">Editar Lead</div>
      <div class="drawer-cod">Corrige nome/telefone/email vindos da sincronização</div>
    </div>
    <button class="drawer-close" onclick="fecharDrawer()">✕</button>
  </div>
  <div class="drawer-body">
    <input type="hidden" id="fUid">
    <div class="link-form-group">
      <label class="link-form-label">Nome</label>
      <input class="link-form-input" id="fNome" placeholder="Nome do cliente">
    </div>
    <div class="link-form-group">
      <label class="link-form-label">Telefone</label>
      <input class="link-form-input" id="fTelefone" placeholder="(62) 99999-9999">
    </div>
    <div class="link-form-group">
      <label class="link-form-label">Email</label>
      <input class="link-form-input" id="fEmail" placeholder="cliente@email.com">
    </div>
    <button class="btn-salvar-drawer" id="btnSalvar" onclick="salvarEdicao()">💾 Salvar</button>
  </div>
</div>

<script>
const SESS_KEY  = 'bi_session';
const TOKEN_KEY = 'bi_session_token';
function tokenSessao() { return sessionStorage.getItem(TOKEN_KEY) || ''; }

function trataNaoAutenticado(json) {
  if (json && json.status === 'nao_autenticado') { window.location.href = 'index.html'; return true; }
  return false;
}

function showToast(msg, tipo) {
  const t = document.getElementById('toast');
  if (!t) return;
  t.textContent = msg;
  t.className = 'toast ' + (tipo || 'ok');
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 3500);
}

(function init() {
  if (sessionStorage.getItem(SESS_KEY) !== 'ok') { window.location.href = 'index.html'; return; }
})();

let _leads = [];
let _leadsMap = {};
let _filtroAtual = 'todos';

async function carregarLeads() {
  try {
    const resp = await fetch(WEBHOOK_URL + '?acao=listar_todos_leads_imobzi&token=' + encodeURIComponent(tokenSessao()));
    const json = await resp.json();
    if (trataNaoAutenticado(json)) return;
    _leads = json.leads || [];
    _leadsMap = {};
    _leads.forEach(l => { _leadsMap[l.idLeadImobzi] = l; });
    renderLista();

    // Deep link ?id=<idLeadImobzi> — vindo do botão "Editar" do card no
    // Dashboard, abre direto o drawer desse lead específico.
    const idDeepLink = new URLSearchParams(location.search).get('id');
    if (idDeepLink && _leadsMap[idDeepLink]) abrirDrawer(idDeepLink);
  } catch(e) {
    document.getElementById('root').innerHTML = '<div class="bi-empty">Erro ao carregar leads.</div>';
  }
}

function mudarFiltro(f) {
  _filtroAtual = f;
  document.querySelectorAll('.filtro-chip').forEach(c => c.classList.toggle('on', c.dataset.f === f));
  renderLista();
}

function statusInfo(l) {
  const pip = String(l.pipeline || '');
  if (l.statusBase === 'RE-LEAD-IMOBZI') return { texto: '🔁 Re-lead Imobzi', bg: 'rgba(255,193,7,.15)', cor: '#ffc107' };
  if (pip === 'MIGRADO') return { texto: '✅ Migrado', bg: 'rgba(79,124,255,.15)', cor: 'var(--accent)' };
  if (l.statusBase === 'JÁ NA BASE') return { texto: '⚠ Já na base', bg: 'rgba(255,184,0,.15)', cor: '#ffc107' };
  return { texto: '🎯 Lead', bg: 'rgba(255,90,90,.15)', cor: '#ff5a5a' };
}

function avatarStyle(l) {
  const si = statusInfo(l);
  return `background:${si.bg};border-color:${si.cor};color:${si.cor}`;
}

function passaFiltro(l) {
  const pip = String(l.pipeline || '');
  if (_filtroAtual === 'pendentes') return pip !== 'MIGRADO' && l.statusBase !== 'RE-LEAD-IMOBZI';
  if (_filtroAtual === 'relead')    return l.statusBase === 'RE-LEAD-IMOBZI';
  if (_filtroAtual === 'migrados')  return pip === 'MIGRADO';
  return true;
}

function renderLista() {
  const termo = (document.getElementById('searchInput').value || '').toLowerCase().trim();
  const filtrados = _leads.filter(l => {
    if (!passaFiltro(l)) return false;
    if (!termo) return true;
    return [l.nome, l.telefone, l.email, l.codigoImovel].some(v => String(v || '').toLowerCase().includes(termo));
  }).sort((a, b) => String(b.dataCadastro || '').localeCompare(String(a.dataCadastro || '')));

  const root = document.getElementById('root');
  if (!filtrados.length) {
    root.innerHTML = '<div class="bi-empty">Nenhum lead encontrado.</div>';
    return;
  }

  root.innerHTML = filtrados.map(l => {
    const si = statusInfo(l);
    const badge = `<span class="status-badge" style="background:${si.bg};color:${si.cor}">${si.texto}</span>`;
    const codigoBadge = l.codigoImovel
      ? `<span style="font-size:10px;font-weight:700;font-family:monospace;color:var(--accent);
          background:rgba(79,124,255,.12);border:1px solid rgba(79,124,255,.3);border-radius:6px;
          padding:2px 7px;margin-left:6px">🏷 ${l.codigoImovel}</span>`
      : '';
    return `
    <div class="bi-card">
      <div class="bi-avatar" style="${avatarStyle(l)}">${(l.nome||'?')[0].toUpperCase()}</div>
      <div class="bi-info">
        <div class="bi-name">${l.nome || 'Sem nome'}${codigoBadge}${badge}</div>
        ${l.telefone ? `<div class="bi-sub">📞 ${l.telefone}</div>` : ''}
        ${l.email    ? `<div class="bi-sub">✉ ${l.email}</div>` : ''}
        <div class="bi-sub">📅 ${l.dataCadastro || '—'} · ${l.canal || 'Imobzi'}</div>
      </div>
      <div class="bi-actions">
        <button class="bi-btn" style="background:var(--surface2);color:var(--accent)" onclick="abrirDrawer('${l.idLeadImobzi}')">✏️ Editar</button>
        <button class="bi-btn" style="background:rgba(255,90,90,.12);color:var(--danger)" onclick="excluirLead('${l.idLeadImobzi}')">🗑 Excluir</button>
      </div>
    </div>`;
  }).join('');
}

function abrirDrawer(uid) {
  const l = _leadsMap[uid];
  if (!l) return;
  document.getElementById('fUid').value      = uid;
  document.getElementById('fNome').value     = l.nome     || '';
  document.getElementById('fTelefone').value = l.telefone || '';
  document.getElementById('fEmail').value    = l.email    || '';
  document.getElementById('drawerTitulo').textContent = l.nome ? 'Editar ' + l.nome : 'Editar Lead';
  document.getElementById('drawer').classList.add('open');
  document.getElementById('drawerOverlay').classList.add('open');
  document.body.style.overflow = 'hidden';
}

function fecharDrawer() {
  document.getElementById('drawer').classList.remove('open');
  document.getElementById('drawerOverlay').classList.remove('open');
  document.body.style.overflow = '';
  // Remove o ?id= da URL ao fechar, pra um F5 não reabrir o mesmo drawer.
  if (new URLSearchParams(location.search).get('id')) {
    window.history.replaceState({}, '', 'leads-imobzi.html');
  }
}

async function salvarEdicao() {
  const uid      = document.getElementById('fUid').value;
  const nome     = document.getElementById('fNome').value.trim();
  const telefone = document.getElementById('fTelefone').value.trim();
  const email    = document.getElementById('fEmail').value.trim();
  if (!nome) { showToast('Nome é obrigatório.', 'erro'); return; }

  const btn = document.getElementById('btnSalvar');
  btn.disabled = true; btn.textContent = 'Salvando...';
  try {
    const fd = new FormData();
    fd.append('dados', JSON.stringify({ acao: 'atualizar_lead_imobzi', idLeadImobzi: uid, nome, telefone, email, token: tokenSessao() }));
    const resp = await fetch(WEBHOOK_URL, { method: 'POST', body: fd });
    const r = await resp.json();
    if (trataNaoAutenticado(r)) return;
    if (!r.ok) throw new Error(r.erro || 'Erro desconhecido');
    const l = _leadsMap[uid];
    if (l) { l.nome = nome; l.telefone = telefone; l.email = email; }
    fecharDrawer();
    renderLista();
    showToast('Lead atualizado.', 'ok');
  } catch(e) {
    showToast('Erro ao salvar: ' + e.message, 'erro');
  } finally {
    btn.disabled = false; btn.textContent = '💾 Salvar';
  }
}

async function excluirLead(uid) {
  const l = _leadsMap[uid];
  const nome = l ? (l.nome || 'este lead') : 'este lead';
  if (!confirm(`Excluir "${nome}" permanentemente?\n\nEsta ação não pode ser desfeita.`)) return;
  try {
    const fd = new FormData();
    fd.append('dados', JSON.stringify({ acao: 'excluir_lead_imobzi', idLeadImobzi: uid, token: tokenSessao() }));
    const resp = await fetch(WEBHOOK_URL, { method: 'POST', body: fd });
    const r = await resp.json();
    if (trataNaoAutenticado(r)) return;
    if (!r.ok) throw new Error(r.erro || JSON.stringify(r));
    _leads = _leads.filter(x => x.idLeadImobzi !== uid);
    delete _leadsMap[uid];
    renderLista();
    showToast('Lead excluído.', 'ok');
  } catch(e) {
    showToast('Erro ao excluir: ' + e.message, 'erro');
  }
}

carregarLeads();
</script>
</body>
</html>
