<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Insight — BASE INTELIGENTE</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap');

:root {
  --bg:#0f1117; --surface:#181c27; --surface2:#1e2335; --surface3:#242840;
  --border:#2a3050; --border2:#343d60; --accent:#4f7cff; --accent2:#00d4aa;
  --text:#e8ecf4; --text2:#8892aa; --text3:#4a5470;
  --radius:12px; --radius-sm:8px; --radius-xs:6px;
}
* { box-sizing:border-box; margin:0; padding:0; }
body { background:var(--bg); color:var(--text); font-family:'Inter',sans-serif; font-size:14px; min-height:100vh; }
a { text-decoration:none; color:inherit; }

.header {
  background:var(--surface); border-bottom:1px solid var(--border);
  padding:14px 24px; display:flex; align-items:center; justify-content:space-between;
  position:sticky; top:0; z-index:100;
}
.logo { font-family:'Space Grotesk',sans-serif; font-size:15px; font-weight:700; color:var(--accent); letter-spacing:-.3px; flex-shrink:0; }
.logo span { color:var(--text2); font-weight:400; }
.nav-tabs { display:flex; background:var(--bg); border-radius:8px; padding:3px; gap:2px;
            overflow-x:auto; -webkit-overflow-scrolling:touch; scrollbar-width:none; min-width:0; }
.nav-tabs::-webkit-scrollbar { display:none; }
.nav-tab { padding:6px 16px; border-radius:6px; border:none; background:transparent; color:var(--text2);
           font-size:13px; font-weight:500; cursor:pointer; transition:all .2s; font-family:'Inter',sans-serif;
           text-decoration:none; display:inline-block; flex-shrink:0; }
.nav-tab:hover { color:var(--text); }
.nav-tab.active { background:var(--accent); color:#fff; }
.refresh-btn { background:transparent; border:1px solid var(--border); border-radius:8px; color:var(--text2);
               padding:6px 14px; font-size:13px; cursor:pointer; font-family:'Inter',sans-serif; transition:all .2s; flex-shrink:0; }
.refresh-btn:hover { border-color:var(--accent); color:var(--accent); }
@media (max-width:640px) {
  .header { padding:12px 14px; gap:8px; }
  .logo { font-size:13px; }
  .nav-tab { padding:6px 11px; font-size:12px; }
  .container { padding:20px 14px; }
}

.container { max-width:1100px; margin:0 auto; padding:28px 24px; }

.back-btn {
  background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-sm);
  color:var(--text2); padding:7px 16px; font-size:13px; cursor:pointer;
  font-family:'Inter',sans-serif; margin-bottom:20px; display:inline-flex; align-items:center; gap:6px;
  transition:all .2s;
}
.back-btn:hover { border-color:var(--accent); color:var(--accent); }

.insight-banner {
  border-left:4px solid var(--ic, var(--accent));
  background:var(--surface); border-radius:var(--radius);
  padding:20px 24px; margin-bottom:24px;
  display:flex; align-items:center; gap:16px;
  position:relative; overflow:hidden;
}
.insight-banner::before { content:''; position:absolute; inset:0; background:var(--ic,var(--accent)); opacity:.04; pointer-events:none; }
.insight-banner-icon { font-size:36px; }
.insight-banner-title { font-family:'Space Grotesk',sans-serif; font-size:20px; font-weight:700; }
.insight-banner-count { font-size:13px; color:var(--text3); margin-top:5px; }

.detail-wrap { background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); overflow:auto; }
.detail-table { width:100%; border-collapse:collapse; min-width:540px; }
.detail-table th {
  padding:10px 16px; text-align:left; font-size:10px; font-weight:700;
  text-transform:uppercase; letter-spacing:.8px; color:var(--text3);
  background:var(--surface2); border-bottom:1px solid var(--border);
  white-space:nowrap;
}
.detail-table td { padding:12px 16px; border-bottom:1px solid var(--border); font-size:13px; vertical-align:middle; }
.detail-table tr:last-child td { border-bottom:none; }
.detail-table tr:hover td { background:rgba(255,255,255,.02); }

.mp-overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:500;opacity:0;pointer-events:none;transition:opacity .2s}
.mp-overlay.open{opacity:1;pointer-events:all}
.mp-panel{position:fixed;top:50%;left:50%;transform:translate(-50%,-48%) scale(.97);width:calc(100% - 32px);max-width:500px;max-height:78vh;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);z-index:501;display:flex;flex-direction:column;opacity:0;pointer-events:none;transition:all .2s;overflow:hidden}
.mp-panel.open{opacity:1;pointer-events:all;transform:translate(-50%,-50%) scale(1)}
.mp-header{padding:16px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:12px;flex-shrink:0}
.mp-body{overflow-y:auto;flex:1}
.mp-body::-webkit-scrollbar{width:4px}
.mp-body::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px}
.mp-cli{display:flex;align-items:center;gap:10px;padding:10px 20px;border-bottom:1px solid rgba(42,48,80,.4)}
.mp-cli:last-child{border-bottom:none}
.mp-cli-score{font-size:11px;font-weight:700;padding:2px 7px;border-radius:99px;flex-shrink:0;white-space:nowrap}
.mp-fav-btn{flex-shrink:0;background:var(--surface2);border:1px solid var(--border);color:var(--text3);width:30px;height:30px;border-radius:50%;font-size:15px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .15s;padding:0}
.mp-fav-btn:hover:not(:disabled){border-color:#f5a623;color:#f5a623}
.mp-fav-btn.ativo{background:rgba(245,166,35,.15);border-color:#f5a623;color:#f5a623}
.mp-fav-btn:disabled{opacity:.5;cursor:default}
.match-count-btn{display:inline-flex;align-items:center;gap:3px;font-size:11px;font-weight:700;padding:2px 8px;border-radius:99px;cursor:pointer;background:rgba(0,212,170,.12);color:var(--accent2);border:1px solid rgba(0,212,170,.3);transition:all .15s;white-space:nowrap}
.match-count-btn:hover{filter:brightness(1.15)}

.td-nome { font-weight:600; }
.td-tel { color:var(--text2); font-size:12px; }
.wpp { display:inline-block; margin-left:8px; color:#25d366; font-size:11px; font-weight:600; }
.wpp:hover { text-decoration:underline; }

.badge {
  display:inline-block; padding:2px 9px; border-radius:99px;
  font-size:11px; font-weight:600; border:1px solid;
}
.badge-blue   { background:rgba(79,124,255,.12); color:var(--accent); border-color:rgba(79,124,255,.2); }
.badge-green  { background:rgba(0,212,170,.12); color:#00d4aa; border-color:rgba(0,212,170,.2); }
.badge-amber  { background:rgba(245,166,35,.12); color:#f5a623; border-color:rgba(245,166,35,.2); }
.badge-red    { background:rgba(255,90,90,.12);  color:#ff5a5a; border-color:rgba(255,90,90,.2); }
.badge-purple { background:rgba(167,139,250,.12); color:#a78bfa; border-color:rgba(167,139,250,.2); }
.badge-muted  { background:rgba(74,84,112,.1); color:var(--text3); border-color:var(--border); }

.score-num { font-family:'Space Grotesk',sans-serif; font-weight:700; }
.score-hot  { color:#ff5a5a; }
.score-warm { color:#f5a623; }
.score-cold { color:var(--accent); }

.mc-wrap { display:inline-flex; gap:4px; }
.mc-hot  { background:rgba(255,90,90,.2);  color:#ff5a5a; border-radius:4px; padding:1px 7px; font-size:11px; font-weight:700; }
.mc-warm { background:rgba(245,166,35,.2); color:#f5a623; border-radius:4px; padding:1px 7px; font-size:11px; font-weight:700; }

.detail-table tr.has-obs td { border-bottom:none; padding-bottom:4px; }
.obs-row .td-obs {
  padding:0 16px 10px; border-bottom:1px solid var(--border);
  font-size:12px; font-style:italic; color:#f5a623; background:rgba(245,166,35,.06);
}
.empty { text-align:center; padding:48px; color:var(--text3); }
.dias-chip { font-size:11px; color:var(--text3); margin-left:6px; }
</style>
</head>
<body>

<div class="header">
  <div class="logo">BASE <span>INTELIGENTE</span></div>
  <div class="nav-tabs">
    <a href="formulario.html"  class="nav-tab">Formulário</a>
    <a href="dashboard.html"   class="nav-tab">Dashboard</a>
    <a href="busca.html"       class="nav-tab">Busca Aberta</a>
    <a href="lancamentos.html" class="nav-tab">Lançamentos</a>
    <a href="dashboard.html?secao=baseimob"   class="nav-tab">BaseImob</a>
    <a href="dashboard.html?secao=imobzi"   class="nav-tab">Leads Imobzi</a>
    <a href="dashboard.html?secao=adm"   class="nav-tab">ADM</a>
  </div>
  <button class="refresh-btn" onclick="history.back()">← Voltar</button>
</div>

<div class="container">
  <div id="root">Carregando...</div>
</div>

<!-- PAINEL MATCHES DO IMÓVEL -->
<div class="mp-overlay" id="mpOverlay" onclick="fecharMatchesPanel()"></div>
<div class="mp-panel" id="mpPanel">
  <div class="mp-header">
    <div style="flex:1;min-width:0">
      <div id="mpTitle" style="font-family:'Space Grotesk',sans-serif;font-size:15px;font-weight:700;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">—</div>
      <div id="mpSub" style="font-size:12px;color:var(--text3);margin-top:4px">—</div>
    </div>
    <button onclick="fecharMatchesPanel()" style="background:transparent;border:none;color:var(--text3);font-size:22px;cursor:pointer;padding:0 4px;line-height:1;flex-shrink:0">✕</button>
  </div>
  <div class="mp-body" id="mpBody"></div>
</div>

<script src="config.js"></script>
<script>
const SESS_KEY  = 'bi_session';
const TOKEN_KEY = 'bi_session_token';
let _imoveisDetail = [];

(function init() {
  if (sessionStorage.getItem(SESS_KEY) !== 'ok') { window.location.href = 'index.html'; return; }
  const raw = sessionStorage.getItem('bi_insight_detail');
  if (!raw) {
    // Sem dados = veio direto pela URL ou sessão expirou. Redireciona ao dashboard.
    document.getElementById('root').innerHTML =
      '<div class="empty">Redirecionando ao Dashboard…<br><small><a href="dashboard.html" style="color:var(--accent)">Clique aqui se não redirecionar automaticamente</a></small></div>';
    setTimeout(() => { window.location.href = 'dashboard.html'; }, 1500);
    return;
  }
  let d;
  try { d = JSON.parse(raw); } catch(e) {
    document.getElementById('root').innerHTML='<div class="empty">Dados inválidos. <a href="dashboard.html" style="color:var(--accent)">← Voltar ao Dashboard</a></div>';
    return;
  }
  try {
    renderDetail(d);
  } catch(e) {
    document.getElementById('root').innerHTML=`<div class="empty">Erro ao exibir insight: ${e.message}.<br><a href="dashboard.html" style="color:var(--accent)">← Voltar ao Dashboard</a></div>`;
    console.error('renderDetail error:', e, d);
  }
})();

function renderDetail(d) {
  const items = d.items || [];
  const color = d.color || 'var(--accent)';
  let tableHtml;
  switch (d.type) {
    case 'clientes':    tableHtml = tableClientes(items); break;
    case 'lancamentos': tableHtml = tableLancamentos(items); break;
    case 'leads':       tableHtml = tableLeads(items); break;
    case 'pads':        tableHtml = tablePads(items); break;
    case 'imoveis':     tableHtml = tableImoveis(items); break;
    case 'acoes':       tableHtml = tableAcoes(items); break;
    default: tableHtml = '<div class="empty">Tipo desconhecido.</div>';
  }
  document.getElementById('root').innerHTML = `
    <button class="back-btn" onclick="history.back()">← Voltar ao Dashboard</button>
    <div class="insight-banner" style="--ic:${color}">
      <div class="insight-banner-icon">${d.icon||'💡'}</div>
      <div>
        <div class="insight-banner-title">${d.title||'Insight'}</div>
        <div class="insight-banner-count">${items.length} registro${items.length!==1?'s':''} encontrado${items.length!==1?'s':''}</div>
      </div>
    </div>
    ${tableHtml}`;
}

/* ── helpers ── */
function wpp(tel) {
  const t = String(tel||'').replace(/\D/g,'');
  return t ? `<a class="wpp" href="https://wa.me/55${t}" target="_blank">💬 WhatsApp</a>` : '';
}
function scoreEl(sc) {
  const n = parseInt(sc)||0;
  if (!n) return '<span style="color:var(--text3)">—</span>';
  const cls = n>=75?'score-hot':n>=50?'score-warm':'score-cold';
  return `<span class="score-num ${cls}">${n}</span>`;
}
function mcEl(mc80, mc70) {
  const a=parseInt(mc80)||0, b=parseInt(mc70)||0;
  if (!a&&!b) return '<span style="color:var(--text3)">0</span>';
  return `<span class="mc-wrap">${a?`<span class="mc-hot">${a}</span>`:''}`
        +`${b?`<span class="mc-warm">${b}</span>`:''}</span>`;
}
function urgBadge(urg) {
  if (!urg||urg==='—') return '<span style="color:var(--text3)">—</span>';
  const cls = /Imediata|Alta/i.test(urg)?'badge-red':/[Mm][eé]dia/i.test(urg)?'badge-amber':'badge-muted';
  return `<span class="badge ${cls}">${urg}</span>`;
}

/* ── tables ── */
function tableClientes(items) {
  if (!items.length) return '<div class="empty">Nenhum cliente encontrado.</div>';
  const favs = JSON.parse(localStorage.getItem('bi_cli_favs') || '{}');
  const rows = items.map(c => {
    const dias   = c.dias ? `<span class="dias-chip">${c.dias}d atrás</span>` : '';
    const cKey   = String(c.cod || c.codCliente || c.nome || '').replace(/'/g, "\\'");
    const isFav  = !!favs[c.cod || c.codCliente || c.nome || ''];
    return `<tr>
      <td class="td-nome">${c.nome||'—'}</td>
      <td>${c.segmento||c.seg||'—'}</td>
      <td>${urgBadge(c.urgencia||c.urg)}</td>
      <td>${scoreEl(c.score)}</td>
      <td>${c.ultimoContato||'—'}${dias}</td>
      <td style="text-align:center"><button class="mp-fav-btn${isFav?' ativo':''}" onclick="toggleFavCli('${cKey}',this)">${isFav?'★':'☆'}</button></td>
    </tr>`;
  }).join('');
  return `<div class="detail-wrap"><table class="detail-table">
    <thead><tr>
      <th>Nome</th><th>Segmento</th><th>Urgência</th><th>Score</th>
      <th>Último contato</th><th>Favoritar</th>
    </tr></thead><tbody>${rows}</tbody>
  </table></div>`;
}

function toggleFavCli(cKey, btn) {
  const favs   = JSON.parse(localStorage.getItem('bi_cli_favs') || '{}');
  const nowFav = !favs[cKey];
  if (nowFav) favs[cKey] = true; else delete favs[cKey];
  localStorage.setItem('bi_cli_favs', JSON.stringify(favs));
  btn.textContent = nowFav ? '★' : '☆';
  btn.classList.toggle('ativo', nowFav);
}

function tableLancamentos(items) {
  if (!items.length) return '<div class="empty">Nenhum lançamento encontrado.</div>';
  const fmt = v => { const n=parseInt(String(v||'').replace(/\D/g,'')); if(!n)return'—'; return n>=1e6?'R$'+(n/1e6).toFixed(1)+'M':'R$'+(n/1e3).toFixed(0)+'k'; };
  const rows = items.map(l => `<tr>
    <td class="td-nome">${l.nomeEmpreendimento||l.nome||'—'}</td>
    <td><span class="badge badge-blue">${l.padrao||'—'}</span></td>
    <td><span class="badge badge-muted">${l.status||'—'}</span></td>
    <td>${l.previsaoEntrega||'—'}</td>
    <td>${fmt(l.precoMedio||l.preco)}</td>
    <td>${l.construtora||'—'}</td>
  </tr>`).join('');
  return `<div class="detail-wrap"><table class="detail-table">
    <thead><tr><th>Empreendimento</th><th>Padrão</th><th>Status</th><th>Previsão Entrega</th><th>Preço Médio</th><th>Construtora</th></tr></thead>
    <tbody>${rows}</tbody>
  </table></div>`;
}

function tableLeads(items) {
  if (!items.length) return '<div class="empty">Nenhum lead encontrado.</div>';
  const rows = items.map(l => `<tr>
    <td class="td-nome">${l.nome||'—'}</td>
    <td class="td-tel">${l.telefone||'—'}${wpp(l.telefone)}</td>
    <td><span class="badge badge-purple">${l.tipo_contato||'—'}</span></td>
    <td>${l.canal||'—'}</td>
    <td>${scoreEl(l.score)}</td>
  </tr>`).join('');
  return `<div class="detail-wrap"><table class="detail-table">
    <thead><tr><th>Nome</th><th>Telefone</th><th>Tipo Contato</th><th>Canal</th><th>Score</th></tr></thead>
    <tbody>${rows}</tbody>
  </table></div>`;
}

function tableImoveis(items) {
  if (!items.length) return '<div class="empty">Nenhum imóvel encontrado.</div>';
  _imoveisDetail = items;
  const fmt = v => { const n = parseInt(String(v||'').replace(/\D/g,'')); if (!n) return '—'; return 'R$ ' + n.toLocaleString('pt-BR'); };
  const rows = items.map((im, imIdx) => {
    const local  = [im.condominio, im.bairro].filter(Boolean).join(' — ');
    const specs  = [
      im.quartos  ? `${im.quartos}q`   : '',
      im.suites   ? `${im.suites}s`    : '',
      im.vagas    ? `${im.vagas}v`     : '',
      im.areaUtil ? `${im.areaUtil}m²` : '',
    ].filter(Boolean).join(' · ');
    const movCls   = im._movimento === 'Removido' ? 'badge-red' : im._movimento === 'Modificado' ? 'badge-amber' : 'badge-green';
    const fonteCls = im.fonte === 'LANCAMENTO' ? 'badge-amber' : 'badge-blue';
    const temObs   = im._mudancas && im._mudancas.length;
    const obsRow   = temObs ? `<tr class="obs-row"><td colspan="9" class="td-obs">obs: ${im._mudancas.join('; ')}</td></tr>` : '';
    const mList    = im._matches || [];
    const matchCell = mList.length > 0
      ? `<span class="match-count-btn" onclick="abrirMatchesPanel(${imIdx})">🎯 ${mList.length}</span>`
      : `<span style="color:var(--text3);font-size:12px">—</span>`;
    const topScore = mList.length > 0
      ? Math.max(...mList.map(m => m.score || 0))
      : (im._bestScore > 0 ? im._bestScore : null);
    const scoreCell = topScore !== null ? scoreEl(topScore) : `<span style="color:var(--text3);font-size:12px">—</span>`;
    return `<tr${temObs ? ' class="has-obs"' : ''}>
      <td class="td-nome">${im.codigo || '—'}</td>
      <td>${im.tipo || '—'}</td>
      <td>${local || '—'}</td>
      <td>${specs || '—'}</td>
      <td>${fmt(im.valorVenda)}</td>
      <td><span class="badge ${fonteCls}">${im.fonte || '—'}</span></td>
      <td><span class="badge ${movCls}">${im._movimento || '—'}</span></td>
      <td style="text-align:center">${matchCell}</td>
      <td style="text-align:center">${scoreCell}</td>
    </tr>${obsRow}`;
  }).join('');
  return `<div class="detail-wrap"><table class="detail-table">
    <thead><tr><th>Código</th><th>Tipo</th><th>Local</th><th>Specs</th><th>Valor</th><th>Fonte</th><th>Movimento</th><th>Matches 🎯</th><th>Score</th></tr></thead>
    <tbody>${rows}</tbody>
  </table></div>`;
}

function tableAcoes(items) {
  if (!items.length) return '<div class="empty">Nenhuma ação planejada nos próximos 7 dias.</div>';
  const rows = items.map(a => {
    const tel = a.telefone || '—';
    const situacao = a.dias > 0  ? `<span class="badge badge-red">Venceu há ${a.dias} dia${a.dias===1?'':'s'}</span>`
      : a.dias === 0 ? '<span class="badge badge-amber">Vence hoje</span>'
      : `<span class="badge badge-blue">Em ${Math.abs(a.dias)} dia${Math.abs(a.dias)===1?'':'s'}</span>`;
    return `<tr>
      <td class="td-nome">${a.nome||'—'}</td>
      <td class="td-tel">${tel}${wpp(tel)}</td>
      <td>${a.proximaAcao||'—'}</td>
      <td>${a.proximaAcaoData||'—'}</td>
      <td>${situacao}</td>
    </tr>`;
  }).join('');
  return `<div class="detail-wrap"><table class="detail-table">
    <thead><tr><th>Nome</th><th>Telefone</th><th>Ação planejada</th><th>Data</th><th>Situação</th></tr></thead>
    <tbody>${rows}</tbody>
  </table></div>`;
}

function tablePads(items) {
  if (!items.length) return '<div class="empty">Nenhum padrão sem demanda encontrado.</div>';
  const rows = items.map(p => `<tr>
    <td class="td-nome">${p.padrao||p.pad||'—'}</td>
    <td><span class="badge badge-red">Sem clientes cadastrados</span></td>
  </tr>`).join('');
  return `<div class="detail-wrap"><table class="detail-table">
    <thead><tr><th>Padrão no lançamento</th><th>Situação</th></tr></thead>
    <tbody>${rows}</tbody>
  </table></div>`;
}

// ── PAINEL MATCHES ────────────────────────────────────────────────────────────

function abrirMatchesPanel(imIdx) {
  const im      = _imoveisDetail[imIdx] || {};
  const matches = im._matches || [];
  const local   = [im.condominio, im.bairro].filter(Boolean).join(' — ');
  document.getElementById('mpTitle').textContent = local || im.tipo || im.codigo || 'Imóvel';
  document.getElementById('mpSub').textContent   = '🎯 ' + matches.length + ' cliente' + (matches.length !== 1 ? 's' : '') + ' com perfil compatível';

  const scoreStyle = sc => {
    const n = parseInt(sc) || 0;
    return n >= 80 ? 'background:rgba(255,90,90,.15);color:#ff5a5a'
         : n >= 70 ? 'background:rgba(245,166,35,.15);color:#f5a623'
         :           'background:rgba(79,124,255,.15);color:#4f7cff';
  };

  document.getElementById('mpBody').innerHTML = matches.length
    ? matches.map((m, i) => `
        <div class="mp-cli">
          <div style="flex:1;min-width:0">
            <div style="font-weight:600;font-size:13px;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${m.nome || '—'}</div>
            <div style="display:flex;gap:8px;margin-top:3px;flex-wrap:wrap;align-items:center">
              ${m.codCliente ? `<span style="font-size:11px;color:var(--text3);font-family:monospace">#${m.codCliente}</span>` : ''}
              ${m.seg        ? `<span style="font-size:11px;color:var(--text2)">${m.seg}</span>` : ''}
            </div>
          </div>
          <span class="mp-cli-score" style="${scoreStyle(m.score)}">${parseInt(m.score)||0} pts</span>
          <button class="mp-fav-btn" id="mpFav_${imIdx}_${i}"
            onclick="toggleFavInsight(${imIdx}, '${(m.codCliente||'').replace(/'/g,"\\'")}', ${i}, this)"
            title="Favoritar este imóvel para ${(m.nome||'').replace(/"/g,'&quot;')}">☆</button>
        </div>`)
      .join('')
    : '<div style="text-align:center;padding:40px;color:var(--text3);font-size:13px">Nenhum cliente com match encontrado.</div>';

  document.getElementById('mpOverlay').classList.add('open');
  document.getElementById('mpPanel').classList.add('open');
}

function fecharMatchesPanel() {
  document.getElementById('mpOverlay').classList.remove('open');
  document.getElementById('mpPanel').classList.remove('open');
}

async function toggleFavInsight(imIdx, cliCodigo, matchIdx, btnEl) {
  if (typeof WEBHOOK_URL === 'undefined') return;
  const token = sessionStorage.getItem(TOKEN_KEY) || '';
  const im    = _imoveisDetail[imIdx] || {};
  btnEl.disabled = true;
  try {
    const payload = {
      acao: 'toggle_favorito', token,
      idCliente:    cliCodigo,
      fonte:        im.fonte        || 'REVENDA',
      imoCodigo:    im.codigo       || '',
      imoTipo:      im.tipo         || '',
      imoBairro:    im.bairro       || '',
      imoCondominio:im.condominio   || '',
      imoEndereco:  im.endereco     || '',
      imoQuartos:   im.quartos      || '',
      imoSuites:    im.suites       || '',
      imoVagas:     im.vagas        || '',
      imoAreaUtil:  im.areaUtil     || '',
      imoValorVenda:im.valorVenda   || '',
      imoPadrao:    im.padrao       || '',
      imoEstagio:   im.estagio      || '',
      imoFoto:      im.foto         || '',
      imoUrl:       im.urlSite      || '',
      imoConstrutora: '',
      imoEntrega:   ''
    };
    const resp = await fetch(WEBHOOK_URL, { method: 'POST', body: new URLSearchParams({ dados: JSON.stringify(payload) }) });
    const r    = await resp.json();
    const adicionado = r.status === 'adicionado';
    btnEl.textContent = adicionado ? '★' : '☆';
    btnEl.classList.toggle('ativo', adicionado);
  } catch(e) { /* silent */ }
  btnEl.disabled = false;
}
</script>
