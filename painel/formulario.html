<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Base Inteligente — Formulário</title>
</head>
<body>
<!-- O formulário completo (cadastro novo + busca/edição) foi incorporado
     como abas dentro de contatos.html — ver CHANGELOG. Este arquivo só
     existe pra não quebrar links/favoritos antigos que ainda apontam pra
     "formulario.html", inclusive com "?linha=X" (link de editar). -->
<script>
  const params = new URLSearchParams(window.location.search);
  const linha  = params.get('linha');
  window.location.replace('contatos.html' + (linha ? ('?linha=' + encodeURIComponent(linha)) : '?tab=novo'));
</script>
</body>
</html>
