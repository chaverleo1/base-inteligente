<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Estratégias — BASE INTELIGENTE</title>
</head>
<body>
<!-- O conteúdo de Estratégias se mudou pra dentro de Lançamentos (aba
     "Estratégias") -- pedido explícito do usuário. Este arquivo continua
     existindo só como redirecionamento, porque outras páginas do sistema
     (contatos.html, e o nav-tab "Estratégias" de todas as telas) ainda
     apontam pra "estrategias.html", inclusive com ?cliente=CTT-XXX pro
     mix personalizado de um cliente específico -- preservado no redirect. -->
<script>
  const cliente = new URLSearchParams(location.search).get('cliente');
  const destino = 'lancamentos.html?tab=estrategias' + (cliente ? '&cliente=' + encodeURIComponent(cliente) : '');
  location.replace(destino);
</script>
</body>
</html>
