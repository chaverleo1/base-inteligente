<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contatos — BASE INTELIGENTE</title>
<script src="config.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap');

:root {
  --bg:#0f1117; --surface:#181c27; --surface2:#1e2335; --surface3:#242840;
  --border:#2a3050; --border2:#343d60; --accent:#4f7cff; --accent2:#00d4aa;
  --text:#e8ecf4; --text2:#8892aa; --text3:#4a5470;
  --radius:12px; --radius-sm:8px; --radius-xs:6px;
}
* { box-sizing:border-box; margin:0; padding:0; }
body { background:var(--bg); color:var(--text); font-family:'Inter',sans-serif; font-size:14px; min-height:100vh; }
a { text-decoration:none; color:inherit; }

.header {
  background:var(--surface); border-bottom:1px solid var(--border);
  padding:14px 24px; display:flex; align-items:center; justify-content:space-between;
  position:sticky; top:0; z-index:100;
}
.logo { font-family:'Space Grotesk',sans-serif; font-size:15px; font-weight:700; color:var(--accent); letter-spacing:-.3px; }
.logo span { color:var(--text2); font-weight:400; }
.nav-tabs { display:flex; background:var(--bg); border-radius:8px; padding:3px; gap:2px; }
.nav-tab { padding:6px 16px; border-radius:6px; border:none; background:transparent; color:var(--text2);
           font-size:13px; font-weight:500; cursor:pointer; transition:all .2s; font-family:'Inter',sans-serif;
           text-decoration:none; display:inline-block; }
.nav-tab:hover { color:var(--text); }
.nav-tab.active { background:var(--accent); color:#fff; }
.refresh-btn { background:transparent; border:1px solid var(--border); border-radius:8px; color:var(--text2);
               padding:6px 14px; font-size:13px; cursor:pointer; font-family:'Inter',sans-serif; transition:all .2s; }
.refresh-btn:hover { border-color:var(--accent); color:var(--accent); }

.container { max-width:1200px; margin:0 auto; padding:28px 24px; }

.back-btn {
  background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-sm);
  color:var(--text2); padding:7px 16px; font-size:13px; cursor:pointer;
  font-family:'Inter',sans-serif; margin-bottom:20px; display:inline-flex; align-items:center; gap:6px;
  transition:all .2s;
}
.back-btn:hover { border-color:var(--accent); color:var(--accent); }

.page-header { display:flex; align-items:center; justify-content:space-between; gap:14px; margin-bottom:20px; flex-wrap:wrap; }
.page-title { font-family:'Space Grotesk',sans-serif; font-size:22px; font-weight:700; }
.page-sub { font-size:13px; color:var(--text3); margin-top:3px; }

.search-bar {
  background:var(--surface); border:1px solid var(--border); border-radius:var(--radius);
  padding:12px 16px; display:flex; align-items:center; gap:10px; margin-bottom:20px;
}
.search-bar input { background:transparent; border:none; color:var(--text); font-size:14px; font-family:'Inter',sans-serif; width:100%; outline:none; }
.search-icon { color:var(--text3); font-size:15px; }

.detail-wrap { background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); overflow:auto; }
.detail-table { width:100%; border-collapse:collapse; min-width:760px; }
.detail-table th {
  padding:10px 16px; text-align:left; font-size:10px; font-weight:700;
  text-transform:uppercase; letter-spacing:.8px; color:var(--text3);
  background:var(--surface2); border-bottom:1px solid var(--border);
  white-space:nowrap;
}
.detail-table td { padding:12px 16px; border-bottom:1px solid var(--border); font-size:13px; vertical-align:middle; }
.detail-table tr:last-child td { border-bottom:none; }
.detail-table tr:hover td { background:rgba(255,255,255,.02); }

.td-nome { font-weight:600; }
.td-cod { font-family:monospace; color:var(--text2); font-size:12px; }
.link-nome { cursor:pointer; color:var(--text); transition:color .15s; }
.link-nome:hover { color:var(--accent); text-decoration:underline; }

.badge {
  display:inline-block; padding:2px 9px; border-radius:99px;
  font-size:11px; font-weight:600; border:1px solid;
}
.badge-blue   { background:rgba(79,124,255,.12); color:var(--accent); border-color:rgba(79,124,255,.2); }
.badge-red    { background:rgba(255,90,90,.12);  color:#ff5a5a; border-color:rgba(255,90,90,.2); }
.badge-amber  { background:rgba(245,166,35,.12); color:#f5a623; border-color:rgba(245,166,35,.2); }
.badge-muted  { background:rgba(74,84,112,.1); color:var(--text3); border-color:var(--border); }

.score-num { font-family:'Space Grotesk',sans-serif; font-weight:700; }
.score-hot  { color:#ff5a5a; }
.score-warm { color:#f5a623; }
.score-cold { color:var(--accent); }

.btn-editar { background:rgba(79,124,255,.1); border:1px solid rgba(79,124,255,.25); color:var(--accent);
              border-radius:var(--radius-xs); padding:5px 12px; font-size:12px; font-weight:600;
              cursor:pointer; font-family:'Inter',sans-serif; transition:all .18s; white-space:nowrap; }
.btn-editar:hover { background:rgba(79,124,255,.2); }

.empty { text-align:center; padding:48px; color:var(--text3); }
.count-info { font-size:12px; color:var(--text3); margin-bottom:14px; }
</style>
</head>
<body>

<div class="header">
  <div class="logo">BASE <span>INTELIGENTE</span></div>
  <div class="nav-tabs">
    <a href="formulario.html"  class="nav-tab">Formulário</a>
    <a href="dashboard.html"   class="nav-tab">Dashboard</a>
    <a href="busca.html"       class="nav-tab">Busca Aberta</a>
    <a href="lancamentos.html" class="nav-tab">Lançamentos</a>
    <a href="dashboard.html"   class="nav-tab">BaseImob</a>
    <a href="dashboard.html"   class="nav-tab">ADM</a>
  </div>
  <button class="refresh-btn" onclick="window.location.href='dashboard.html'">← Voltar ao Dashboard</button>
</div>

<div class="container">
  <div class="page-header">
    <div>
      <div class="page-title">Todos os contatos</div>
      <div class="page-sub">Lista completa da base — clique em "Editar" para abrir o cadastro completo.</div>
    </div>
  </div>

  <div class="search-bar">
    <span class="search-icon">🔍</span>
    <input type="text" id="searchInput" placeholder="Buscar por nome, telefone ou código..." oninput="filtrar()">
  </div>

  <div id="root"><div class="empty">Carregando contatos...</div></div>
</div>

<script>
const SESS_KEY  = 'bi_session';
const TOKEN_KEY = 'bi_session_token';
function tokenSessao() { return sessionStorage.getItem(TOKEN_KEY) || ''; }

let _contatos = [];

(function init() {
  if (sessionStorage.getItem(SESS_KEY) !== 'ok') { window.location.href = 'index.html'; return; }
})();

async function carregar() {
  try {
    const resp = await fetch(WEBHOOK_URL + '?acao=buscar&q=&token=' + encodeURIComponent(tokenSessao()));
    const json = await resp.json();
    if (json && json.status === 'nao_autenticado') { window.location.href = 'index.html'; return; }
    _contatos = Array.isArray(json) ? json : [];
    // Mais recentes primeiro (aproximação: ordem inversa da planilha)
    _contatos.reverse();
    render(_contatos);
  } catch (e) {
    document.getElementById('root').innerHTML = '<div class="empty">Erro ao carregar contatos: ' + e.message + '</div>';
  }
}

function filtrar() {
  const q = document.getElementById('searchInput').value.trim().toLowerCase();
  if (!q) { render(_contatos); return; }
  const filtrados = _contatos.filter(c =>
    String(c.nome||'').toLowerCase().includes(q) ||
    String(c.telefone||'').toLowerCase().includes(q) ||
    String(c.idCliente||'').toLowerCase().includes(q)
  );
  render(filtrados);
}

function scoreEl(sc) {
  const n = parseInt(sc)||0;
  if (!n) return '<span style="color:var(--text3)">—</span>';
  const cls = n>=75?'score-hot':n>=50?'score-warm':'score-cold';
  return `<span class="score-num ${cls}">${n}</span>`;
}

// Parse de data pra timestamp ordenável — precisa lidar com DOIS formatos
// possíveis pro mesmo campo:
// 1. "dd/MM/yyyy HH:mm" — o que Utilities.formatDate grava no Apps Script.
// 2. ISO 8601 ("2026-07-06T21:30:00.000Z") — o que a própria célula do Sheets
//    pode virar: gravar uma string com "cara de data" faz o Sheets
//    auto-converter a célula pro tipo Data (dependendo do locale da
//    planilha), e quando o Apps Script lê essa célula de volta ela já vem
//    como objeto Date — que o JSON.stringify() do backend serializa como ISO
//    antes de mandar pro navegador. Sem tratar os dois formatos, a coluna
//    Status e a ordenação por "Atualizado em" ficavam quebradas pra qualquer
//    contato cuja célula tivesse sido convertida.
// new Date(string) sozinho não serve pro formato 1 — o parser nativo do JS
// trata strings não-ISO como MM/DD/YYYY, trocando dia e mês silenciosamente
// pra qualquer dia <= 12. Por isso o formato brasileiro precisa de regex
// explícito, e só usamos new Date() quando já é claramente ISO.
function parseDataBr_(s) {
  const str = String(s||'').trim();
  if (!str) return 0;
  if (/^\d{4}-\d{2}-\d{2}T/.test(str)) {
    const t = new Date(str).getTime();
    return isNaN(t) ? 0 : t;
  }
  const m = str.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})(?:\s+(\d{1,2}):(\d{2}))?/);
  if (!m) return 0;
  return new Date(+m[3], +m[2]-1, +m[1], +(m[4]||0), +(m[5]||0)).getTime();
}

// Mesma dualidade de formato de parseDataBr_ (dd/MM/yyyy HH:mm OU ISO),
// mas pra EXIBIÇÃO — converte ISO de volta pro formato brasileiro em vez de
// mostrar a string crua (ex: "2026-07-06T21:30:00.000Z") nas colunas de data.
function formatarDataDisplay_(s) {
  const str = String(s||'').trim();
  if (!str) return '—';
  if (!/^\d{4}-\d{2}-\d{2}T/.test(str)) return str;
  const d = new Date(str);
  if (isNaN(d.getTime())) return str;
  return new Intl.DateTimeFormat('pt-BR', {
    timeZone: 'America/Sao_Paulo', day: '2-digit', month: '2-digit', year: 'numeric',
    hour: '2-digit', minute: '2-digit'
  }).format(d).replace(',', '');
}

// Status por TEMPO DE CADASTRO (dataAtualizacao) — mesmos limiares de
// fatorFrescor_() no backend (≤15 dias / 15-30 / >30). Isto NÃO é o mesmo
// "Quente/Morno/Frio" da home do dashboard, que combina o score do cliente
// com a qualidade dos matches dele; aqui é só há quanto tempo o cadastro foi
// editado pela última vez.
function statusFrescorEl(dataAtualizacao) {
  const ts = parseDataBr_(dataAtualizacao);
  if (!ts) return '<span class="badge badge-muted" title="Sem data de atualização registrada">—</span>';
  const dias = Math.round((Date.now() - ts) / 86400000);
  const titulo = `Cadastro atualizado há ${dias} dia${dias!==1?'s':''} — status de tempo, não de match`;
  if (dias <= 15) return `<span class="badge badge-red"   title="${titulo}">🔴 Quente</span>`;
  if (dias <= 30) return `<span class="badge badge-amber" title="${titulo}">🟡 Morno</span>`;
  return `<span class="badge badge-blue" title="${titulo}">🔵 Frio</span>`;
}

function render(lista) {
  const ordenada = [...lista].sort((a,b) => parseDataBr_(b.dataAtualizacao) - parseDataBr_(a.dataAtualizacao));
  document.getElementById('root').innerHTML = `
    <div class="count-info">${ordenada.length} contato${ordenada.length!==1?'s':''} encontrado${ordenada.length!==1?'s':''}</div>
    ${tabela(ordenada)}`;
}

function tabela(items) {
  if (!items.length) return '<div class="empty">Nenhum contato encontrado.</div>';
  const rows = items.map(c => {
    const score = c.scoreEfetivo != null ? c.scoreEfetivo : c.score;
    const abrirArgs = [c.nome||'', score||0, c.idCliente||''].map(v => JSON.stringify(v).replace(/"/g,'&quot;'));
    return `<tr>
    <td class="td-cod">${c.idCliente || '—'}</td>
    <td class="td-nome"><a class="link-nome" onclick="abrirClienteDash(${abrirArgs.join(', ')})" title="Ver ficha completa">${c.nome || '—'}</a></td>
    <td>${c.segmento ? `<span class="badge badge-blue">${c.segmento}</span>` : '<span class="badge badge-muted">—</span>'}</td>
    <td>${scoreEl(score)}</td>
    <td>${statusFrescorEl(c.dataAtualizacao)}</td>
    <td>${formatarDataDisplay_(c.dataAtualizacao)}</td>
    <td><button class="btn-editar" onclick="editar(${c._linha})">✏️ Editar</button></td>
  </tr>`;
  }).join('');
  return `<div class="detail-wrap"><table class="detail-table">
    <thead><tr>
      <th>Código</th><th>Nome</th><th>Segmento</th><th>Score</th>
      <th title="Status por tempo de cadastro — diferente do Quente/Morno/Frio da home, que é sobre qualidade de match">Status</th>
      <th>Atualizado em</th><th></th>
    </tr></thead><tbody>${rows}</tbody>
  </table></div>`;
}

function editar(linha) {
  window.location.href = 'formulario.html?linha=' + encodeURIComponent(linha);
}

// Abre o drawer do cliente no Dashboard — mesma ficha (dados + lista de
// matches) que abre lá ao clicar num nome nas colunas Quentes/Mornos/Frios.
// Passa por query string em vez de duplicar todo o HTML/CSS/JS do drawer
// aqui dentro.
function abrirClienteDash(nome, score, cod) {
  const params = new URLSearchParams({ abrirCliente: '1', nome, score, cod });
  window.location.href = 'dashboard.html?' + params.toString();
}

carregar();
</script>
</body>
</html>
