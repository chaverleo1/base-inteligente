<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Prontos para Morar — Goiânia</title>
<meta name="description" content="Apartamentos e imóveis prontos para morar em Goiânia. Encontre o apartamento ideal.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* ── RESET ───────────────────────────────────────────────── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
img { display: block; max-width: 100%; }
button { font-family: inherit; cursor: pointer; border: none; background: none; }
a { text-decoration: none; color: inherit; }

/* ── TOKENS ──────────────────────────────────────────────── */
:root {
  --accent:  #1B5540;
  --accent2: rgba(27,85,64,.08);
  --orange:  #F56E14;
  --orange2: rgba(245,110,20,.10);
  --bg:      #F4F2EF;
  --surface: #FFFFFF;
  --text:    #1A1A1A;
  --text2:   #6B6B6B;
  --text3:   #9B9B9B;
  --border:  rgba(0,0,0,.07);
  --shadow:  0 2px 10px rgba(0,0,0,.07);
  --shadow-h:0 8px 28px rgba(0,0,0,.14);
  --r: 14px;
  --font: 'Manrope', system-ui, sans-serif;
}

/* ── BASE ────────────────────────────────────────────────── */
body {
  background: var(--bg);
  font-family: var(--font);
  color: var(--text);
  min-height: 100vh;
}

/* ── HEADER ──────────────────────────────────────────────── */
.header {
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  position: sticky; top: 0; z-index: 100;
  box-shadow: 0 1px 8px rgba(0,0,0,.06);
}
.header-inner {
  max-width: 1600px; margin: 0 auto;
  padding: 0 24px; height: 64px;
  display: flex; align-items: center; justify-content: space-between; gap: 16px;
}
.header-logo { display: flex; align-items: center; gap: 12px; }
.header-icon {
  width: 38px; height: 38px; border-radius: 10px;
  background: var(--accent);
  display: flex; align-items: center; justify-content: center; flex-shrink: 0;
}
.header-name {
  font-size: 17px; font-weight: 800; letter-spacing: -.4px; line-height: 1.15;
  color: var(--text);
}
.header-sub { font-size: 11px; font-weight: 500; color: var(--text3); letter-spacing: .4px; }
.header-badge {
  background: var(--accent2); color: var(--accent);
  font-size: 13px; font-weight: 700; padding: 6px 14px;
  border-radius: 999px; white-space: nowrap;
}

/* ── STRIP ───────────────────────────────────────────────── */
.hero-strip {
  background: var(--accent);
  padding: 14px 24px;
  text-align: center;
}
.hero-strip p {
  color: rgba(255,255,255,.85);
  font-size: clamp(13px, 2vw, 15px);
  font-weight: 500; line-height: 1.4;
  max-width: 700px; margin: 0 auto;
}
.hero-strip strong { color: #fff; font-weight: 800; }

/* ── GRID ────────────────────────────────────────────────── */
.grid-wrap { max-width: 1600px; margin: 0 auto; padding: 12px 12px 60px; }
.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(185px, 1fr));
  gap: 8px;
}

/* ── CARD (estilo Pinterest — sem container branco) ──────── */
.card {
  background: transparent;
  cursor: pointer;
  display: flex; flex-direction: column;
}

/* thumbnail 9:16 vertical */
.card-thumb-wrap {
  position: relative;
  padding-top: 177.78%;   /* 9:16 */
  overflow: hidden;
  border-radius: 14px;
  flex-shrink: 0;
}
.card-thumb {
  position: absolute; inset: 0;
  width: 100%; height: 100%;
  object-fit: cover;
  transition: transform .4s ease;
}
.card:hover .card-thumb { transform: scale(1.04); }
.card-thumb-grad {
  position: absolute; inset: 0;
}
/* sombra surge no hover para o overlay ficar legível */
.card-thumb-shadow {
  position: absolute; inset: 0;
  background: linear-gradient(to bottom, transparent 45%, rgba(0,0,0,.55) 100%);
  pointer-events: none;
  opacity: 0;
  transition: opacity .25s;
}
.card:hover .card-thumb-shadow { opacity: 1; }

/* pill de entrega — discreta, fundo translúcido */
.card-pill {
  position: absolute; top: 10px; left: 10px;
  background: rgba(0,0,0,.52); color: #fff;
  font-size: 9.5px; font-weight: 700;
  padding: 3px 9px; border-radius: 999px;
  letter-spacing: .3px;
  backdrop-filter: blur(6px);
  pointer-events: none;
}

/* overlay VER MAIS — aparece no hover */
.card-hover-overlay {
  position: absolute; inset: 0;
  display: flex; align-items: flex-end; justify-content: center;
  padding-bottom: 14px;
  opacity: 0;
  transition: opacity .2s;
}
.card:hover .card-hover-overlay { opacity: 1; }
.card-ver-mais-pill {
  display: block;
  background: var(--orange); color: #fff;
  font-size: 11px; font-weight: 800; letter-spacing: .6px;
  padding: 8px 22px; border-radius: 999px;
  transform: translateY(8px);
  transition: transform .22s ease;
}
.card:hover .card-ver-mais-pill { transform: translateY(0); }

/* ── CARD INFO (texto abaixo, fundo transparente) ────────── */
.card-info {
  padding: 7px 3px 0;
  background: transparent;
  display: flex; flex-direction: column;
}
.card-titulo {
  font-size: 12.5px; font-weight: 700; line-height: 1.3; color: var(--text);
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
}
.card-preco {
  font-size: 11.5px; font-weight: 800; color: var(--accent);
  margin-top: 2px; letter-spacing: -.2px;
}

/* ── FOOTER ──────────────────────────────────────────────── */
.footer {
  border-top: 1px solid var(--border);
  padding: 24px;
  text-align: center;
  font-size: 13px; color: var(--text3); font-weight: 500;
}
.footer a { color: var(--accent); font-weight: 700; }

/* ── RESPONSIVE ──────────────────────────────────────────── */
@media (max-width: 640px) {
  .header-name { font-size: 15px; }
  .grid { grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 6px; }
  .grid-wrap { padding: 8px 8px 48px; }
}
@media (max-width: 360px) {
  .grid { grid-template-columns: repeat(2, 1fr); gap: 5px; }
}
</style>
</head>
<body>

<!-- SVG sprite (ícones inline) -->
<svg style="display:none" xmlns="http://www.w3.org/2000/svg">
  <symbol id="ico-home" viewBox="0 0 20 20">
    <path d="M10 2L2 8.5V18h5.5v-5h5v5H18V8.5L10 2z"/>
  </symbol>
  <symbol id="ico-bed" viewBox="0 0 20 20">
    <rect x="2" y="10" width="16" height="7" rx="1.5"/>
    <rect x="2" y="5" width="7" height="5" rx="1.5"/>
    <rect x="11" y="5" width="7" height="5" rx="1.5"/>
    <rect x="2" y="17" width="2" height="2" rx="1"/>
    <rect x="16" y="17" width="2" height="2" rx="1"/>
  </symbol>
  <symbol id="ico-area" viewBox="0 0 20 20">
    <rect x="3" y="3" width="14" height="14" rx="1" fill="none" stroke="currentColor" stroke-width="1.8"/>
    <path d="M7 13l6-6M11 7h2v2" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
  </symbol>
  <symbol id="ico-car" viewBox="0 0 20 20">
    <rect x="2" y="9" width="16" height="7" rx="2"/>
    <path d="M4 9l2-4h8l2 4"/>
    <circle cx="5.5" cy="16.5" r="1.5"/>
    <circle cx="14.5" cy="16.5" r="1.5"/>
  </symbol>
  <symbol id="ico-play" viewBox="0 0 20 20">
    <polygon points="6,3 17,10 6,17"/>
  </symbol>
</svg>

<!-- HEADER -->
<header class="header">
  <div class="header-inner">
    <div class="header-logo">
      <div class="header-icon">
        <svg width="20" height="20" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M10 2L2 8.5V18h5.5v-5h5v5H18V8.5L10 2z" fill="#fff"/>
        </svg>
      </div>
      <div>
        <div class="header-name">PRONTOS PARA MORAR</div>
        <div class="header-sub">Goiânia · GO</div>
      </div>
    </div>
    <span class="header-badge" id="headerBadge">— imóveis</span>
  </div>
</header>

<!-- GRID -->
<div class="grid-wrap">
  <div class="grid" id="grid"></div>
</div>

<!-- FOOTER -->
<footer class="footer">
  <p>© 2026 Prontos para Morar · Goiânia, GO &nbsp;·&nbsp;
     <a href="../app-lancamentos.html">Ver lançamentos</a>
  </p>
</footer>

<script src="data.js"></script>
<script>
// ── Renderiza os cards (estilo Pinterest) ───────────────────
function renderCard(im) {
  const thumb = thumbUrl(im);
  const thumbHtml = thumb
    ? `<img class="card-thumb" src="${thumb}" alt="${im.titulo}" loading="lazy"
            onerror="this.style.display='none'">`
    : '';
  const gradStyle = `background:linear-gradient(135deg,${im.grad[0]},${im.grad[1]})`;

  return `
  <article class="card" onclick="window.location='imovel.html?id=${im.id}'" role="button" tabindex="0"
           onkeydown="if(event.key==='Enter')window.location='imovel.html?id=${im.id}'">
    <div class="card-thumb-wrap">
      <div class="card-thumb-grad" style="${gradStyle}"></div>
      ${thumbHtml}
      <div class="card-thumb-shadow"></div>
      <span class="card-pill">${im.entrega}</span>
      <div class="card-hover-overlay">
        <span class="card-ver-mais-pill">VER MAIS ›</span>
      </div>
    </div>
    <div class="card-info">
      <div class="card-titulo">${im.titulo}</div>
      <div class="card-preco">${formatBRL(im.preco)}</div>
    </div>
  </article>`;
}

function init() {
  const grid = document.getElementById('grid');
  grid.innerHTML = IMOVEIS.map(renderCard).join('');
  document.getElementById('headerBadge').textContent =
    `${IMOVEIS.length} imóvel${IMOVEIS.length !== 1 ? 'is' : ''}`;
}

document.addEventListener('DOMContentLoaded', init);
</script>
</body>
</html>
