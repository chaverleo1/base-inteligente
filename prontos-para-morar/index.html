<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Prontos para Morar — Goiânia</title>
<meta name="description" content="Apartamentos e imóveis prontos para morar em Goiânia. Encontre o apartamento ideal.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* ── RESET ───────────────────────────────────────────────── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
img { display: block; max-width: 100%; }
button { font-family: inherit; cursor: pointer; border: none; background: none; }
a { text-decoration: none; color: inherit; }

/* ── TOKENS ──────────────────────────────────────────────── */
:root {
  --accent:  #1B5540;
  --accent2: rgba(27,85,64,.08);
  --orange:  #F56E14;
  --orange2: rgba(245,110,20,.10);
  --bg:      #F4F2EF;
  --surface: #FFFFFF;
  --text:    #1A1A1A;
  --text2:   #6B6B6B;
  --text3:   #9B9B9B;
  --border:  rgba(0,0,0,.07);
  --shadow:  0 2px 10px rgba(0,0,0,.07);
  --shadow-h:0 8px 28px rgba(0,0,0,.14);
  --r: 14px;
  --font: 'Manrope', system-ui, sans-serif;
}

/* ── BASE ────────────────────────────────────────────────── */
body {
  background: var(--bg);
  font-family: var(--font);
  color: var(--text);
  min-height: 100vh;
}

/* ── HEADER ──────────────────────────────────────────────── */
.header {
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  position: sticky; top: 0; z-index: 100;
  box-shadow: 0 1px 8px rgba(0,0,0,.06);
}
.header-inner {
  max-width: 1600px; margin: 0 auto;
  padding: 0 24px; height: 64px;
  display: flex; align-items: center; justify-content: space-between; gap: 16px;
}
.header-logo { display: flex; align-items: center; gap: 12px; }
.header-icon {
  width: 38px; height: 38px; border-radius: 10px;
  background: var(--accent);
  display: flex; align-items: center; justify-content: center; flex-shrink: 0;
}
.header-name {
  font-size: 17px; font-weight: 800; letter-spacing: -.4px; line-height: 1.15;
  color: var(--text);
}
.header-sub { font-size: 11px; font-weight: 500; color: var(--text3); letter-spacing: .4px; }
.header-badge {
  background: var(--accent2); color: var(--accent);
  font-size: 13px; font-weight: 700; padding: 6px 14px;
  border-radius: 999px; white-space: nowrap;
}

/* ── STRIP ───────────────────────────────────────────────── */
.hero-strip {
  background: var(--accent);
  padding: 14px 24px;
  text-align: center;
}
.hero-strip p {
  color: rgba(255,255,255,.85);
  font-size: clamp(13px, 2vw, 15px);
  font-weight: 500; line-height: 1.4;
  max-width: 700px; margin: 0 auto;
}
.hero-strip strong { color: #fff; font-weight: 800; }

/* ── GRID ────────────────────────────────────────────────── */
.grid-wrap { max-width: 1400px; margin: 0 auto; padding: 10px 10px 60px; }
.grid {
  display: grid;
  grid-template-columns: repeat(5, 1fr);  /* desktop: 5 colunas fixas */
  gap: 8px;
}

/* ── CARD (estilo Pinterest — sem container branco) ──────── */
.card {
  background: transparent;
  cursor: pointer;
  display: flex; flex-direction: column;
}

/* thumbnail 9:16 vertical */
.card-thumb-wrap {
  position: relative;
  padding-top: 177.78%;   /* 9:16 */
  overflow: hidden;
  border-radius: 14px;
  flex-shrink: 0;
}
.card-thumb {
  position: absolute; inset: 0;
  width: 100%; height: 100%;
  object-fit: cover;
  transition: transform .4s ease;
}
.card:hover .card-thumb { transform: scale(1.04); }
.card-thumb-grad {
  position: absolute; inset: 0;
}
/* sombra surge no hover para o overlay ficar legível */
.card-thumb-shadow {
  position: absolute; inset: 0;
  background: linear-gradient(to bottom, transparent 45%, rgba(0,0,0,.55) 100%);
  pointer-events: none;
  opacity: 0;
  transition: opacity .25s;
}
.card:hover .card-thumb-shadow { opacity: 1; }

/* pill de entrega — discreta, fundo translúcido */
.card-pill {
  position: absolute; top: 10px; left: 10px;
  background: rgba(0,0,0,.52); color: #fff;
  font-size: 9.5px; font-weight: 700;
  padding: 3px 9px; border-radius: 999px;
  letter-spacing: .3px;
  backdrop-filter: blur(6px);
  pointer-events: none;
}

/* overlay VER MAIS — aparece no hover */
.card-hover-overlay {
  position: absolute; inset: 0;
  display: flex; align-items: flex-end; justify-content: center;
  padding-bottom: 14px;
  opacity: 0;
  transition: opacity .2s;
}
.card:hover .card-hover-overlay { opacity: 1; }
.card-ver-mais-pill {
  display: block;
  background: var(--orange); color: #fff;
  font-size: 11px; font-weight: 800; letter-spacing: .6px;
  padding: 8px 22px; border-radius: 999px;
  transform: translateY(8px);
  transition: transform .22s ease;
}
.card:hover .card-ver-mais-pill { transform: translateY(0); }

/* ── CARD INFO (texto abaixo, fundo transparente) ────────── */
.card-info {
  padding: 6px 2px 0;
  background: transparent;
  display: flex; flex-direction: column;
}
.card-bairro {
  font-size: 12px; font-weight: 700; line-height: 1.25; color: var(--text);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.card-specs-row {
  font-size: 10.5px; font-weight: 500; color: var(--text3);
  margin-top: 1px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.card-preco {
  font-size: 11.5px; font-weight: 800; color: var(--accent);
  margin-top: 2px; letter-spacing: -.2px;
}

/* ── FOOTER ──────────────────────────────────────────────── */
.footer {
  border-top: 1px solid var(--border);
  padding: 24px;
  text-align: center;
  font-size: 13px; color: var(--text3); font-weight: 500;
}
.footer a { color: var(--accent); font-weight: 700; }

/* ── RESPONSIVE ──────────────────────────────────────────── */
@media (max-width: 900px) {
  .grid { grid-template-columns: repeat(3, 1fr); gap: 7px; }
}
@media (max-width: 600px) {
  .header-name { font-size: 15px; }
  .grid { grid-template-columns: repeat(2, 1fr); gap: 6px; }
  .grid-wrap { padding: 6px 6px 48px; }
  .card-bairro { font-size: 11px; }
  .card-specs-row { font-size: 9.5px; }
  .card-preco { font-size: 10.5px; }
}

/* ── BOTÃO FILTRO FIXO ───────────────────────────────────── */
.btn-filtro {
  position: fixed;
  top: calc(64px + 14px);
  left: 14px;
  z-index: 98;
  background: #fff;
  border: 1.5px solid transparent;
  border-radius: 999px;
  padding: 9px 16px;
  display: flex; align-items: center; gap: 8px;
  font-size: 13px; font-weight: 700; color: var(--text);
  font-family: var(--font);
  box-shadow: 0 2px 14px rgba(0,0,0,.18);
  cursor: pointer;
  transition: box-shadow .15s, border-color .15s, background .15s, color .15s;
}
.btn-filtro:hover { box-shadow: 0 4px 22px rgba(0,0,0,.24); }
.btn-filtro.ativo { background: var(--accent); color: #fff; border-color: var(--accent); }
.btn-filtro-badge {
  background: var(--orange); color: #fff;
  font-size: 10px; font-weight: 900;
  min-width: 18px; height: 18px; border-radius: 999px; padding: 0 5px;
  display: none; align-items: center; justify-content: center;
}
.btn-filtro.tem-filtros .btn-filtro-badge { display: flex; }

/* ── OVERLAY ─────────────────────────────────────────────── */
.filtro-overlay {
  display: none; position: fixed; inset: 0;
  background: rgba(0,0,0,.45); z-index: 200;
}
.filtro-overlay.ativo { display: block; }

/* ── PAINEL LATERAL ──────────────────────────────────────── */
.filtro-panel {
  position: fixed; top: 0; right: 0; bottom: 0;
  width: min(360px, 92vw);
  background: #fff; z-index: 201;
  display: flex; flex-direction: column;
  transform: translateX(110%);
  transition: transform .32s cubic-bezier(.4,0,.2,1);
  box-shadow: -4px 0 32px rgba(0,0,0,.16);
}
.filtro-panel.aberto { transform: translateX(0); }
.filtro-panel-header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 18px 20px; border-bottom: 1px solid rgba(0,0,0,.07); flex-shrink: 0;
}
.filtro-panel-titulo { font-size: 16px; font-weight: 800; letter-spacing: -.3px; }
.btn-fechar-panel {
  width: 32px; height: 32px; border-radius: 50%;
  background: rgba(0,0,0,.06); border: none; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  font-size: 15px; color: var(--text2);
  transition: background .15s;
}
.btn-fechar-panel:hover { background: rgba(0,0,0,.12); }
.filtro-corpo { flex: 1; overflow-y: auto; padding: 22px 20px 8px; }
.filtro-corpo::-webkit-scrollbar { width: 4px; }
.filtro-corpo::-webkit-scrollbar-thumb { background: rgba(0,0,0,.12); border-radius: 99px; }

/* ── SEÇÃO ───────────────────────────────────────────────── */
.filtro-secao { margin-bottom: 28px; }
.filtro-secao-label {
  display: block; font-size: 10.5px; font-weight: 800;
  letter-spacing: 1px; text-transform: uppercase;
  color: var(--text3); margin-bottom: 12px;
}

/* ── TAGS ────────────────────────────────────────────────── */
.filtro-tags { display: flex; flex-wrap: wrap; gap: 8px; }
.ftag {
  padding: 8px 14px; border: 1.5px solid rgba(0,0,0,.12);
  border-radius: 999px; font-size: 12.5px; font-weight: 600;
  color: var(--text2); background: #fff; cursor: pointer;
  font-family: var(--font);
  transition: border-color .15s, color .15s, background .15s;
}
.ftag:hover  { border-color: var(--accent); color: var(--accent); }
.ftag.sel    { background: var(--accent2); border-color: var(--accent); color: var(--accent); font-weight: 700; }
.ftag-outro  { border-style: dashed; color: var(--text3); }
.bairro-input-wrap {
  display: none; align-items: center; gap: 8px; margin-top: 10px;
}
.bairro-input-wrap.vis { display: flex; }
.bairro-input {
  flex: 1; padding: 9px 12px; border: 1.5px solid rgba(0,0,0,.12);
  border-radius: 8px; font-size: 13px; font-family: var(--font); outline: none;
}
.bairro-input:focus { border-color: var(--accent); }
.bairro-btn-ok {
  padding: 9px 14px; background: var(--accent); color: #fff;
  border-radius: 8px; font-size: 13px; font-weight: 700; border: none; cursor: pointer;
}

/* ── RANGE DUPLO ─────────────────────────────────────────── */
.range-labels {
  display: flex; justify-content: space-between;
  font-size: 12px; font-weight: 800; color: var(--accent); margin-bottom: 10px;
}
.range-dual { position: relative; height: 34px; margin: 0 4px; }
.range-track {
  position: absolute; top: 50%; left: 0; right: 0;
  height: 4px; background: rgba(0,0,0,.1); border-radius: 2px; transform: translateY(-50%);
}
.range-fill { position: absolute; height: 100%; background: var(--accent); border-radius: 2px; }
.range-dual input[type=range] {
  position: absolute; width: 100%; top: 50%; transform: translateY(-50%);
  -webkit-appearance: none; appearance: none;
  background: transparent; pointer-events: none; margin: 0; height: 4px;
}
.range-dual input[type=range]::-webkit-slider-thumb {
  -webkit-appearance: none; pointer-events: all;
  width: 22px; height: 22px; border-radius: 50%;
  background: #fff; border: 2.5px solid var(--accent);
  box-shadow: 0 1px 6px rgba(0,0,0,.2); cursor: pointer;
}
.range-dual input[type=range]::-moz-range-thumb {
  pointer-events: all; width: 22px; height: 22px; border-radius: 50%;
  background: #fff; border: 2.5px solid var(--accent);
  box-shadow: 0 1px 6px rgba(0,0,0,.2); cursor: pointer; border: 2.5px solid var(--accent);
}

/* ── RODAPÉ DO PAINEL ────────────────────────────────────── */
.filtro-footer {
  padding: 14px 20px; border-top: 1px solid rgba(0,0,0,.07);
  display: flex; gap: 10px; flex-shrink: 0;
}
.btn-limpar {
  flex: 1; padding: 12px; border: 1.5px solid rgba(0,0,0,.12);
  border-radius: 10px; font-size: 13px; font-weight: 700;
  color: var(--text2); background: #fff; cursor: pointer; font-family: var(--font);
  transition: border-color .15s, color .15s;
}
.btn-limpar:hover { border-color: var(--accent); color: var(--accent); }
.btn-aplicar {
  flex: 2; padding: 12px; background: var(--accent); color: #fff;
  border: none; border-radius: 10px; font-size: 13px; font-weight: 800;
  cursor: pointer; font-family: var(--font); transition: background .15s;
}
.btn-aplicar:hover { background: #154430; }

/* sem resultados */
.sem-resultados {
  grid-column: 1/-1; text-align: center; padding: 64px 20px;
  color: var(--text3); font-size: 15px; font-weight: 600; line-height: 1.6;
}
</style>
</head>

<script>
// ── Renderiza card (estilo Pinterest) ────────────────────────
function renderCard(im) {
  const thumb = thumbUrl(im);
  const thumbHtml = thumb
    ? `<img class="card-thumb" src="${thumb}" alt="${im.titulo}" loading="lazy"
            onerror="this.style.display='none'">`
    : '';
  const gradStyle = `background:linear-gradient(135deg,${im.grad[0]},${im.grad[1]})`;
  return `
  <article class="card" onclick="window.location='imovel.html?id=${im.id}'" role="button" tabindex="0"
           onkeydown="if(event.key==='Enter')window.location='imovel.html?id=${im.id}'">
    <div class="card-thumb-wrap">
      <div class="card-thumb-grad" style="${gradStyle}"></div>
      ${thumbHtml}
      <div class="card-thumb-shadow"></div>
      <span class="card-pill">${im.entrega}</span>
      <div class="card-hover-overlay">
        <span class="card-ver-mais-pill">VER MAIS ›</span>
      </div>
    </div>
    <div class="card-info">
      <div class="card-bairro">${im.bairro}</div>
      <div class="card-specs-row">${im.quartos} qtos · ${im.area} m² · ${im.vagas} vg</div>
      <div class="card-preco">${formatBRL(im.preco)}</div>
    </div>
  </article>`;
}

// ── FILTROS ──────────────────────────────────────────────────
let AREA_MIN, AREA_MAX, ORC_MIN, ORC_MAX;
const F = { estagios: new Set(), bairros: new Set(),
            areaMin: 0, areaMax: 9999, orcMin: 0, orcMax: 9e9 };

function initFiltros() {
  const areas = IMOVEIS.map(im => im.area);
  const precs = IMOVEIS.map(im => im.preco);
  AREA_MIN = Math.floor(Math.min(...areas) / 5) * 5;
  AREA_MAX = Math.ceil (Math.max(...areas) / 5) * 5;
  ORC_MIN  = Math.floor(Math.min(...precs) / 50000) * 50000;
  ORC_MAX  = Math.ceil (Math.max(...precs) / 50000) * 50000;
  F.areaMin = AREA_MIN; F.areaMax = AREA_MAX;
  F.orcMin  = ORC_MIN;  F.orcMax  = ORC_MAX;

  // Tags de Estágio
  const estagios = [...new Set(IMOVEIS.map(im => im.entrega))];
  document.getElementById('estagioTags').innerHTML =
    estagios.map(e =>
      `<button class="ftag" data-v="${e}" onclick="toggleTag(this,F.estagios,'${e}')">${e}</button>`
    ).join('');

  // Tags de Bairro
  const bairros = [...new Set(IMOVEIS.map(im => im.bairro))].sort();
  document.getElementById('bairrosTags').innerHTML =
    bairros.map(b =>
      `<button class="ftag" data-v="${b}" onclick="toggleTag(this,F.bairros,'${b}')">${b}</button>`
    ).join('') +
    `<button class="ftag ftag-outro" onclick="abrirBairroInput()">+ OUTRO</button>`;

  // Sliders Área
  ['areaMinR','areaMaxR'].forEach(id => {
    const el = document.getElementById(id);
    el.min = AREA_MIN; el.max = AREA_MAX; el.step = 5;
  });
  document.getElementById('areaMinR').value = AREA_MIN;
  document.getElementById('areaMaxR').value = AREA_MAX;

  // Sliders Orçamento
  ['orcMinR','orcMaxR'].forEach(id => {
    const el = document.getElementById(id);
    el.min = ORC_MIN; el.max = ORC_MAX; el.step = 50000;
  });
  document.getElementById('orcMinR').value = ORC_MIN;
  document.getElementById('orcMaxR').value = ORC_MAX;

  onRangeArea(); onRangeOrc();
}

// Abre / fecha painel
function abrirFiltro() {
  document.getElementById('filtroPanel').classList.add('aberto');
  document.getElementById('filtroOverlay').classList.add('ativo');
  document.body.style.overflow = 'hidden';
}
function fecharFiltro() {
  document.getElementById('filtroPanel').classList.remove('aberto');
  document.getElementById('filtroOverlay').classList.remove('ativo');
  document.body.style.overflow = '';
}

// Toggle de tag genérico (estágio ou bairro)
function toggleTag(el, conjunto, val) {
  el.classList.toggle('sel');
  conjunto.has(val) ? conjunto.delete(val) : conjunto.add(val);
  filtrar();
}

// Range de Área
function onRangeArea() {
  const rMin = document.getElementById('areaMinR');
  const rMax = document.getElementById('areaMaxR');
  let vMin = +rMin.value, vMax = +rMax.value;
  if (vMin > vMax) { vMin = vMax; rMin.value = vMin; }
  const p1 = (vMin - AREA_MIN) / (AREA_MAX - AREA_MIN) * 100;
  const p2 = (vMax - AREA_MIN) / (AREA_MAX - AREA_MIN) * 100;
  const fill = document.getElementById('areaFill');
  fill.style.left = p1 + '%'; fill.style.width = (p2 - p1) + '%';
  document.getElementById('areaMinLabel').textContent = vMin + ' m²';
  document.getElementById('areaMaxLabel').textContent = vMax + ' m²';
  F.areaMin = vMin; F.areaMax = vMax;
  filtrar();
}

// Range de Orçamento
function fmtK(v) {
  if (v >= 1e6) return 'R$' + (v/1e6).toFixed(v%1e6===0?0:1) + 'M';
  return 'R$' + Math.round(v/1000) + 'k';
}
function onRangeOrc() {
  const rMin = document.getElementById('orcMinR');
  const rMax = document.getElementById('orcMaxR');
  let vMin = +rMin.value, vMax = +rMax.value;
  if (vMin > vMax) { vMin = vMax; rMin.value = vMin; }
  const p1 = (vMin - ORC_MIN) / (ORC_MAX - ORC_MIN) * 100;
  const p2 = (vMax - ORC_MIN) / (ORC_MAX - ORC_MIN) * 100;
  const fill = document.getElementById('orcFill');
  fill.style.left = p1 + '%'; fill.style.width = (p2 - p1) + '%';
  document.getElementById('orcMinLabel').textContent = fmtK(vMin);
  document.getElementById('orcMaxLabel').textContent = fmtK(vMax);
  F.orcMin = vMin; F.orcMax = vMax;
  filtrar();
}

// Input de bairro customizado
function abrirBairroInput() {
  const w = document.getElementById('bairroInputWrap');
  w.classList.toggle('vis');
  if (w.classList.contains('vis')) document.getElementById('bairroCustomInput').focus();
}
function adicionarBairroCustom() {
  const inp = document.getElementById('bairroCustomInput');
  const val = inp.value.trim();
  if (!val) return;
  const existente = document.querySelector(`#bairrosTags [data-v="${val}"]`);
  if (existente) {
    if (!existente.classList.contains('sel')) toggleTag(existente, F.bairros, val);
  } else {
    const btn = document.createElement('button');
    btn.className = 'ftag sel'; btn.dataset.v = val; btn.textContent = val;
    btn.onclick = () => toggleTag(btn, F.bairros, val);
    F.bairros.add(val);
    const tags = document.getElementById('bairrosTags');
    tags.insertBefore(btn, tags.lastElementChild);
    filtrar();
  }
  inp.value = '';
  document.getElementById('bairroInputWrap').classList.remove('vis');
}

// Filtragem em tempo real
function filtrar() {
  const lista = IMOVEIS.filter(im =>
    (F.estagios.size === 0 || F.estagios.has(im.entrega)) &&
    im.area  >= F.areaMin && im.area  <= F.areaMax &&
    im.preco >= F.orcMin  && im.preco <= F.orcMax  &&
    (F.bairros.size === 0 || F.bairros.has(im.bairro))
  );

  document.getElementById('grid').innerHTML = lista.length
    ? lista.map(renderCard).join('')
    : `<p class="sem-resultados">Nenhum imóvel com esses filtros.<br>
       <small style="font-size:13px;font-weight:400">Tente ajustar as opções ao lado.</small></p>`;

  // Badge + botão VER RESULTADOS
  const nFiltros = F.estagios.size + F.bairros.size
    + (F.areaMin > AREA_MIN || F.areaMax < AREA_MAX ? 1 : 0)
    + (F.orcMin  > ORC_MIN  || F.orcMax  < ORC_MAX  ? 1 : 0);
  const btn = document.getElementById('btnFiltro');
  btn.classList.toggle('tem-filtros', nFiltros > 0);
  btn.classList.toggle('ativo', nFiltros > 0);
  document.getElementById('filtroBadge').textContent = nFiltros;
  document.getElementById('btnAplicar').textContent =
    lista.length ? `VER ${lista.length} IMÓVE${lista.length===1?'L':'IS'}` : 'NENHUM RESULTADO';
  document.getElementById('headerBadge').textContent =
    `${lista.length} imóvel${lista.length!==1?'is':''}`;
}

function limparFiltros() {
  F.estagios.clear(); F.bairros.clear();
  document.querySelectorAll('.ftag.sel').forEach(el => el.classList.remove('sel'));
  document.getElementById('areaMinR').value = AREA_MIN;
  document.getElementById('areaMaxR').value = AREA_MAX;
  document.getElementById('orcMinR').value  = ORC_MIN;
  document.getElementById('orcMaxR').value  = ORC_MAX;
  document.getElementById('bairroInputWrap').classList.remove('vis');
  onRangeArea(); onRangeOrc();
}

// Boot
function init() {
  document.getElementById('grid').innerHTML = IMOVEIS.map(renderCard).join('');
  document.getElementById('headerBadge').textContent =
    `${IMOVEIS.length} imóvel${IMOVEIS.length!==1?'is':''}`;
  initFiltros();
}
document.addEventListener('DOMContentLoaded', init);
</script>
</body>
</html>
