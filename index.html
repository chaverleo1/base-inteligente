<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Base Inteligente</title>
<script src="config.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap');
  :root{--bg:#0f1117;--surface:#181c27;--surface2:#1e2335;--border:#2a3050;
        --accent:#4f7cff;--accent2:#00d4aa;--text:#e8ecf4;--text2:#8892aa;
        --text3:#4a5470;--danger:#ff5a5a;--radius:12px;--radius-sm:8px}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
  .login-overlay{position:fixed;inset:0;background:var(--bg);z-index:9999;display:flex;align-items:center;justify-content:center;padding:24px}
  .login-box{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:40px 36px;width:100%;max-width:400px}
  .login-logo{font-family:'Space Grotesk',sans-serif;font-size:22px;font-weight:700;color:var(--accent);text-align:center;margin-bottom:6px}
  .login-logo span{color:var(--text2);font-weight:400}
  .login-sub{text-align:center;color:var(--text3);font-size:13px;margin-bottom:32px}
  .login-user{background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius-sm);padding:12px 14px;color:var(--text2);font-size:14px;margin-bottom:16px;display:flex;align-items:center;gap:10px}
  .login-avatar{width:32px;height:32px;border-radius:50%;background:var(--accent);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;color:#fff;flex-shrink:0}
  .login-field{display:flex;flex-direction:column;gap:6px;margin-bottom:16px}
  .login-field label{font-size:12px;font-weight:600;color:var(--text2);text-transform:uppercase;letter-spacing:.6px}
  .login-field input{background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius-sm);color:var(--text);font-size:15px;font-family:'Inter',sans-serif;padding:12px 14px;outline:none;transition:border .2s;width:100%}
  .login-field input:focus{border-color:var(--accent)}
  .login-btn{width:100%;padding:14px;background:var(--accent);color:#fff;border:none;border-radius:var(--radius-sm);font-size:15px;font-weight:600;cursor:pointer;font-family:'Inter',sans-serif;margin-top:8px;transition:background .2s}
  .login-btn:hover{background:#3d6aee}
  .login-btn:disabled{opacity:.5;cursor:default}
  .login-err{color:var(--danger);font-size:13px;text-align:center;margin-top:10px;min-height:18px}
  .login-link{text-align:center;margin-top:16px;font-size:13px;color:var(--text3)}
  .login-link a{color:var(--accent);cursor:pointer;text-decoration:none}
  .login-link a:hover{text-decoration:underline}
  /* Ponto único de falha: se a URL do Apps Script (config.js) apontar pra uma
     implantação errada/parada, nenhuma das 16 páginas funciona e o corretor só
     descobre na hora de usar. Este banner avisa isso já na tela de login, sem
     precisar nem digitar senha (ver checarSaudeBackend_ abaixo). */
  .health-banner{display:none;background:rgba(255,90,90,.12);border:1px solid rgba(255,90,90,.4);
    color:var(--danger);border-radius:var(--radius-sm);padding:10px 12px;font-size:12px;
    line-height:1.45;margin-bottom:18px}
  /* init overlay */
  .init-overlay{position:fixed;inset:0;background:var(--bg);z-index:9999;display:none;align-items:center;justify-content:center;padding:24px}
  .init-box{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:44px 48px;width:360px;max-width:90vw;text-align:center}
  .init-logo{font-family:'Space Grotesk',sans-serif;font-size:18px;font-weight:700;color:var(--accent);letter-spacing:-.3px;margin-bottom:32px}
  .init-logo span{color:var(--text2);font-weight:400}
  .init-track{background:var(--surface2);border-radius:99px;height:4px;overflow:hidden}
  .init-fill{background:linear-gradient(90deg,var(--accent),var(--accent2));height:100%;width:0%;border-radius:99px;transition:width .5s ease}
</style>
</head>
<body>

<!-- LOGIN -->
<div class="login-overlay" id="loginOverlay">
  <div class="login-box">
    <div class="login-logo">BASE <span>INTELIGENTE</span></div>
    <div class="login-sub" id="loginSub">Acesso administrativo</div>
    <div class="health-banner" id="healthBanner"></div>
    <div class="login-user">
      <div class="login-avatar">L</div>
      <div>
        <div style="font-weight:600;color:var(--text);font-size:14px">Leonardo Viana</div>
        <div style="font-size:12px">chaverleo@gmail.com</div>
      </div>
    </div>
    <div id="telaLogin">
      <div class="login-field">
        <label>Senha</label>
        <input type="password" id="inputSenha" placeholder="Digite sua senha"
               onkeydown="if(event.key==='Enter')entrar()">
      </div>
      <button class="login-btn" id="btnEntrar" onclick="entrar()">Entrar</button>
      <div class="login-err" id="loginErr"></div>
      <div class="login-link"><a onclick="pedirResetSenha()">Esqueci a senha</a></div>
    </div>
    <div id="telaEsqueci" style="display:none">
      <div style="text-align:center;color:var(--text2);font-size:14px;line-height:1.6;margin-bottom:20px">
        Um link para criar uma nova senha será enviado para<br>
        <strong style="color:var(--text)">chaverleo@gmail.com</strong>
      </div>
      <button class="login-btn" id="btnEnviar" onclick="enviarLinkReset()">Enviar link por e-mail</button>
      <div class="login-err" id="esqueciMsg" style="color:var(--accent2)"></div>
      <div class="login-link"><a onclick="mostrarTelaLogin()">← Voltar ao login</a></div>
    </div>
  </div>
</div>

<!-- INIT -->
<div class="init-overlay" id="initOverlay">
  <div class="init-box">
    <div class="init-logo">BASE <span>INTELIGENTE</span></div>
    <div class="init-track">
      <div class="init-fill" id="initFill"></div>
    </div>
  </div>
</div>

<script>
  const SESS_KEY       = 'bi_session';
  const SESS_TOKEN_KEY = 'bi_session_token';
  const USER_EMAIL     = 'chaverleo@gmail.com';

  function tokenSessao() { return sessionStorage.getItem(SESS_TOKEN_KEY) || ''; }

  async function sha256(texto) {
    const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(texto));
    return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2,'0')).join('');
  }

  const MSG_BACKEND_INACESSIVEL = 'Backend inacessível — verifique se a reimplantação do Apps Script foi feita como "Nova versão" (não "Nova implantação").';

  // Roda em paralelo à tela de login (não atrasa nem bloqueia nada) — avisa o
  // corretor ANTES de ele perder tempo digitando a senha se a WEBHOOK_URL de
  // config.js estiver apontando pra uma implantação parada/trocada. Usa
  // "acao=ping" (backend, sem tocar em planilha) em vez de "verificar_senha"
  // de propósito, pra não misturar "backend fora do ar" com "senha errada"
  // no mesmo request.
  async function checarSaudeBackend_() {
    const banner = document.getElementById('healthBanner');
    const ctrl   = new AbortController();
    const tid    = setTimeout(() => ctrl.abort(), 5000);
    try {
      const resp = await fetch(WEBHOOK_URL + '?acao=ping', { signal: ctrl.signal });
      const data = await resp.json();
      if (!data || data.ok !== true) throw new Error('resposta inesperada');
      banner.style.display = 'none';
    } catch(e) {
      banner.textContent   = '⚠️ ' + MSG_BACKEND_INACESSIVEL;
      banner.style.display = 'block';
    } finally {
      clearTimeout(tid);
    }
  }

  async function verificarAuth() {
    if (sessionStorage.getItem(SESS_KEY) === 'ok' && tokenSessao()) {
      if (sessionStorage.getItem('bi_init_done') === '1') { window.location.href = 'busca.html'; return; }
      inicializarERedirecionar();
      return;
    }
    checarSaudeBackend_();
  }

  async function entrar() {
    const senha = document.getElementById('inputSenha').value;
    const err   = document.getElementById('loginErr');
    const btn   = document.getElementById('btnEntrar');
    if (!senha) { err.textContent = 'Digite sua senha.'; return; }
    btn.disabled = true; btn.textContent = 'Verificando...'; err.textContent = '';
    const hash = await sha256(senha + USER_EMAIL);
    // Timeout de 5s: sem isso, uma implantação travada/trocada deixava o
    // botão preso em "Verificando..." indefinidamente, sem nenhum aviso —
    // era exatamente esse silêncio que fazia o corretor só perceber a falha
    // na hora de usar de verdade.
    const ctrl = new AbortController();
    const tid  = setTimeout(() => ctrl.abort(), 5000);
    try {
      const resp = await fetch(WEBHOOK_URL + '?acao=verificar_senha&hash=' + encodeURIComponent(hash), { signal: ctrl.signal });
      const data = await resp.json();
      if (data.ok) {
        sessionStorage.setItem(SESS_KEY, 'ok');
        sessionStorage.setItem(SESS_TOKEN_KEY, data.token);
        document.getElementById('loginOverlay').style.display = 'none';
        inicializarERedirecionar();
      } else if (data.motivo === 'sem_senha') {
        err.style.color = 'var(--accent)';
        err.textContent = 'Nenhuma senha cadastrada. Use "Esqueci a senha".';
        btn.disabled = false; btn.textContent = 'Entrar';
      } else {
        err.style.color = 'var(--danger)';
        err.textContent = 'Senha incorreta.';
        document.getElementById('inputSenha').value = '';
        btn.disabled = false; btn.textContent = 'Entrar';
      }
    } catch(e) {
      err.style.color = 'var(--danger)';
      err.textContent = e.name === 'AbortError' ? MSG_BACKEND_INACESSIVEL : 'Erro de conexão. Tente novamente.';
      btn.disabled = false; btn.textContent = 'Entrar';
    } finally {
      clearTimeout(tid);
    }
  }

  async function inicializarERedirecionar() {
    // timeout (ms) por etapa — operações pesadas recebem mais tempo,
    // mas nunca travam a barra indefinidamente.
    const FUNCOES = [
      { a: 'migrar_cabecalho_lancamentos',      t: 20000 },
      { a: 'migrar_cabecalho_contatos',         t: 20000 },
      { a: 'preencher_ids_faltantes',           t: 20000 },
      { a: 'preencher_ids_faltantes_contatos',  t: 20000 },
      { a: 'preencher_data_atualizacao',        t: 20000 },
      { a: 'migrar_acoes_planejadas',           t: 20000 },
      { a: 'sincronizar_revenda',               t: 90000 },
      { a: 'criar_gatilho_revenda',             t: 15000 },
      { a: 'criar_gatilho_matching',            t: 15000 },
      { a: 'rodar_matching',                    t: 90000 },
      { a: 'testar_matching',                   t: 30000 },
    ];
    const total  = FUNCOES.length;
    const fillEl = document.getElementById('initFill');
    fillEl.style.width = '0%';
    document.getElementById('initOverlay').style.display = 'flex';

    for (let i = 0; i < total; i++) {
      const { a, t } = FUNCOES[i];
      const ctrl = new AbortController();
      const tid  = setTimeout(() => ctrl.abort(), t);
      try {
        const resp = await fetch(
          WEBHOOK_URL + '?acao=adm_' + a + '&token=' + encodeURIComponent(tokenSessao()),
          { signal: ctrl.signal }
        );
        const r = await resp.json();
        if (r.status === 'nao_autenticado') {
          clearTimeout(tid);
          sessionStorage.removeItem(SESS_KEY);
          window.location.href = 'index.html';
          return;
        }
      } catch(e) { /* timeout ou erro de rede — avança para o próximo passo */ }
      finally    { clearTimeout(tid); }
      fillEl.style.width = Math.round(((i + 1) / total) * 100) + '%';
    }
    sessionStorage.setItem('bi_init_done', '1');
    window.location.href = 'busca.html';
  }

  function pedirResetSenha() {
    document.getElementById('telaLogin').style.display   = 'none';
    document.getElementById('telaEsqueci').style.display = 'block';
    document.getElementById('loginSub').textContent      = 'Redefinir senha';
  }

  async function enviarLinkReset() {
    const btn = document.getElementById('btnEnviar');
    const msg = document.getElementById('esqueciMsg');
    btn.disabled = true; btn.textContent = 'Enviando...'; msg.textContent = '';
    try {
      const resp = await fetch(WEBHOOK_URL + '?acao=esqueci_senha');
      const data = await resp.json();
      if (data.ok) {
        msg.style.color = 'var(--accent2)';
        msg.textContent = 'Link enviado para chaverleo@gmail.com';
        btn.textContent = 'Enviado!';
      } else {
        msg.style.color = 'var(--danger)';
        msg.textContent = 'Erro ao enviar. Tente novamente.';
        btn.disabled = false; btn.textContent = 'Enviar link por e-mail';
      }
    } catch(e) {
      msg.style.color = 'var(--danger)';
      msg.textContent = 'Erro de conexão.';
      btn.disabled = false; btn.textContent = 'Enviar link por e-mail';
    }
  }

  function mostrarTelaLogin() {
    document.getElementById('telaEsqueci').style.display = 'none';
    document.getElementById('telaLogin').style.display   = 'block';
    document.getElementById('loginSub').textContent      = 'Acesso administrativo';
    document.getElementById('inputSenha').focus();
  }

  verificarAuth();
</script>
</body>
</html>
