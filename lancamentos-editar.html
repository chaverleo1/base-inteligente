<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Editar Lançamento — BASE INTELIGENTE</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap');
:root {
  --bg:#0f1117;--surface:#181c27;--surface2:#1e2335;--surface3:#242840;
  --border:#2a3050;--border2:#343d60;--accent:#4f7cff;--accent2:#00d4aa;
  --danger:#ff5a5a;--text:#e8ecf4;--text2:#8892aa;--text3:#4a5470;
  --radius:12px;--radius-sm:8px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;font-size:14px;min-height:100vh}
a{text-decoration:none;color:inherit}

/* ── HEADER ── */
.header{background:var(--surface);border-bottom:1px solid var(--border);padding:14px 24px;
        display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100}
.logo{font-family:'Space Grotesk',sans-serif;font-size:15px;font-weight:700;color:var(--accent);letter-spacing:-.3px;flex-shrink:0}
.logo span{color:var(--text2);font-weight:400}
.nav-tabs{display:flex;background:var(--bg);border-radius:8px;padding:3px;gap:2px;
          overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;min-width:0}
.nav-tabs::-webkit-scrollbar{display:none}
.nav-tab{padding:6px 16px;border-radius:6px;border:none;background:transparent;color:var(--text2);
         font-size:13px;font-weight:500;cursor:pointer;transition:all .2s;font-family:'Inter',sans-serif;
         text-decoration:none;display:inline-block;flex-shrink:0}
.nav-tab:hover{color:var(--text)}
.nav-tab.active{background:var(--accent);color:#fff}
.refresh-btn{background:transparent;border:1px solid var(--border);border-radius:8px;color:var(--text2);
             padding:6px 14px;font-size:13px;cursor:pointer;font-family:'Inter',sans-serif;transition:all .2s;flex-shrink:0}
.refresh-btn:hover{border-color:var(--accent);color:var(--accent)}
@media (max-width:640px) {
  .header{padding:12px 14px;gap:8px}
  .logo{font-size:13px}
  .nav-tab{padding:6px 11px;font-size:12px}
  .container{padding:20px 14px}
}

/* ── LAYOUT ── */
.container{max-width:900px;margin:0 auto;padding:28px 24px}
.page-header{display:flex;align-items:center;gap:14px;margin-bottom:28px}
.page-title{font-family:'Space Grotesk',sans-serif;font-size:22px;font-weight:700}
.page-sub{font-size:13px;color:var(--text3);margin-top:3px}
.back-btn{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);
          color:var(--text2);padding:7px 16px;font-size:13px;cursor:pointer;font-family:'Inter',sans-serif;
          transition:all .2s;display:inline-flex;align-items:center;gap:6px}
.back-btn:hover{border-color:var(--accent);color:var(--accent)}

/* ── SECTIONS ── */
.section{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
         padding:22px 24px;margin-bottom:20px}
.section-title{font-size:11px;font-weight:700;color:var(--text3);text-transform:uppercase;
               letter-spacing:.8px;margin-bottom:16px;display:flex;align-items:center;gap:8px}
.section-title::after{content:'';flex:1;height:1px;background:var(--border)}

/* ── FORM ── */
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:4px}
.form-grid.cols3{grid-template-columns:1fr 1fr 1fr}
@media(max-width:640px){.form-grid,.form-grid.cols3{grid-template-columns:1fr}}
.form-group{display:flex;flex-direction:column;gap:5px}
.form-group.span2{grid-column:span 2}
.form-group.span3{grid-column:span 3}
@media(max-width:640px){.form-group.span2,.form-group.span3{grid-column:span 1}}
.form-label{font-size:10px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.6px}
.form-input{background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius-sm);
            color:var(--text);font-size:13px;font-family:'Inter',sans-serif;padding:9px 12px;
            outline:none;transition:border .2s;width:100%}
.form-input:focus{border-color:var(--accent);box-shadow:0 0 0 2px rgba(79,124,255,.1)}
.form-input::placeholder{color:var(--text3)}
select.form-input option{background:var(--surface2)}
textarea.form-input{resize:vertical;min-height:64px;line-height:1.5}

/* ── UNIDADES ── */
.unidade-wrap{border:1px solid var(--border2);border-radius:var(--radius-sm);
              padding:16px 18px;margin-bottom:12px;position:relative;background:var(--surface2)}
.unidade-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.unidade-num{font-size:11px;font-weight:700;color:var(--accent);text-transform:uppercase;letter-spacing:.6px}
.btn-rem-uni{background:none;border:none;color:var(--text3);cursor:pointer;font-size:18px;
             line-height:1;padding:0 4px;transition:color .2s}
.btn-rem-uni:hover{color:var(--danger)}
.btn-add-uni{background:rgba(79,124,255,.08);border:1px solid rgba(79,124,255,.2);border-radius:var(--radius-sm);
             color:var(--accent);font-size:13px;font-weight:600;padding:10px 20px;cursor:pointer;
             font-family:'Inter',sans-serif;transition:all .2s;width:100%;margin-top:4px}
.btn-add-uni:hover{background:rgba(79,124,255,.14)}

/* ── SAVE BAR ── */
.save-bar{position:sticky;bottom:0;background:var(--surface);border-top:1px solid var(--border);
          padding:14px 24px;display:flex;align-items:center;justify-content:space-between;gap:12px;
          margin-top:24px}
.btn-salvar{background:var(--accent2);color:#000;border:none;border-radius:var(--radius-sm);
            padding:11px 28px;font-size:14px;font-weight:700;cursor:pointer;font-family:'Inter',sans-serif;
            transition:all .2s}
.btn-salvar:hover{background:#00bfa0;transform:translateY(-1px)}
.btn-salvar:disabled{opacity:.5;cursor:default;transform:none}
.save-status{font-size:13px;color:var(--text3)}

/* ── TOAST ── */
.toast{position:fixed;bottom:24px;right:24px;background:var(--surface);border:1px solid var(--border);
       border-radius:var(--radius-sm);padding:12px 18px;font-size:13px;font-weight:500;z-index:9999;
       transform:translateY(80px);opacity:0;transition:all .3s;pointer-events:none;max-width:320px}
.toast.show{transform:translateY(0);opacity:1}
.toast.ok{border-color:var(--accent2);color:var(--accent2)}
.toast.err{border-color:var(--danger);color:var(--danger)}
</style>
</head>
<body>

<div class="header">
  <div class="logo">BASE <span>INTELIGENTE</span></div>
  <div class="nav-tabs">
    <a href="formulario.html"  class="nav-tab">Formulário</a>
    <a href="dashboard.html"   class="nav-tab">Dashboard</a>
    <a href="busca.html"       class="nav-tab">Busca Aberta</a>
    <a href="lancamentos.html" class="nav-tab active">Lançamentos</a>
    <a href="dashboard.html?secao=baseimob"   class="nav-tab">BaseImob</a>
    <a href="dashboard.html"   class="nav-tab">ADM</a>
  </div>
  <button class="refresh-btn" onclick="history.back()">← Voltar</button>
</div>

<div class="container">

  <div class="page-header">
    <div>
      <div class="page-title" id="pageTitulo">Editar Lançamento</div>
      <div class="page-sub" id="pageSub">Carregando dados...</div>
    </div>
  </div>

  <!-- ── DADOS GERAIS ── -->
  <div class="section">
    <div class="section-title">Dados Gerais</div>
    <div class="form-grid cols3">
      <div class="form-group span2">
        <label class="form-label">Nome do empreendimento *</label>
        <input class="form-input" id="f-nomeEmpreendimento" placeholder="Ex: Residencial das Flores" required>
      </div>
      <div class="form-group">
        <label class="form-label">Construtora</label>
        <input class="form-input" id="f-construtora" placeholder="Ex: MRV">
      </div>
    </div>
    <div class="form-grid cols3">
      <div class="form-group">
        <label class="form-label">Tipo de empreendimento</label>
        <select class="form-input" id="f-tipoEmpreendimento">
          <option value="">Selecionar...</option>
          <option>Condomínio Horizontal</option>
          <option>Condomínio Vertical</option>
        </select>
      </div>
      <div class="form-group">
        <label class="form-label">Padrão</label>
        <select class="form-input" id="f-padrao">
          <option value="">Selecionar...</option>
          <option>Econômico</option>
          <option>Médio</option>
          <option>Alto</option>
          <option>Luxo</option>
          <option>Super Luxo</option>
        </select>
      </div>
      <div class="form-group">
        <label class="form-label">Status</label>
        <select class="form-input" id="f-status">
          <option value="">Selecionar...</option>
          <option>Em planta</option>
          <option>Em obras</option>
          <option>Pronto</option>
          <option>Pronto novo</option>
          <option>Entregue</option>
          <option>Lançamento</option>
        </select>
      </div>
    </div>
    <div class="form-grid cols3">
      <div class="form-group span2">
        <label class="form-label">Endereço</label>
        <input class="form-input" id="f-endereco" placeholder="Rua, número">
      </div>
      <div class="form-group">
        <label class="form-label">Bairro</label>
        <input class="form-input" id="f-bairro" placeholder="Ex: Centro">
      </div>
    </div>
    <div class="form-grid cols3">
      <div class="form-group">
        <label class="form-label">Cidade</label>
        <input class="form-input" id="f-cidade" placeholder="Ex: São Paulo">
      </div>
      <div class="form-group">
        <label class="form-label">Estado (UF)</label>
        <input class="form-input" id="f-estado" placeholder="Ex: SP" maxlength="2" style="text-transform:uppercase">
      </div>
      <div class="form-group">
        <label class="form-label">Previsão de entrega</label>
        <input class="form-input" id="f-previsaoEntrega" placeholder="MM/AAAA ou AAAA-MM-DD">
      </div>
    </div>
    <div class="form-grid cols3">
      <div class="form-group">
        <label class="form-label">Estoque</label>
        <input class="form-input" id="f-estoque" type="number" min="0" placeholder="Ex: 18">
      </div>
      <div class="form-group">
        <label class="form-label">Total de unidades</label>
        <input class="form-input" id="f-totalUnidades" type="number" min="0" placeholder="Ex: 839">
      </div>
      <div class="form-group">
        <label class="form-label">Data de lançamento</label>
        <input class="form-input" id="f-dataLancamento" placeholder="Ex: 01/12/2020">
      </div>
    </div>
    <div class="form-grid">
      <div class="form-group">
        <label class="form-label">URL do site / pasta digital</label>
        <input class="form-input" id="f-urlSite" type="url" placeholder="https://...">
      </div>
      <div class="form-group">
        <label class="form-label">Foto / imagem (URL)</label>
        <input class="form-input" id="f-foto" placeholder="https://...">
      </div>
    </div>
    <div class="form-grid">
      <div class="form-group">
        <label class="form-label">Lazer / diferenciais</label>
        <textarea class="form-input" id="f-lazer" rows="2" placeholder="Ex: Piscina, academia, salão..."></textarea>
      </div>
      <div class="form-group">
        <label class="form-label">Conceito / descrição</label>
        <textarea class="form-input" id="f-conceito" rows="2" placeholder="Ex: Vida integrada à natureza..."></textarea>
      </div>
    </div>
  </div>

  <!-- ── TIPOLOGIAS ── -->
  <div class="section">
    <div class="section-title">Tipologias / Unidades</div>
    <div id="unidades-wrap"></div>
    <button class="btn-add-uni" onclick="addUnidade()">+ Adicionar tipologia</button>
  </div>

</div><!-- /container -->

<div class="save-bar">
  <span class="save-status" id="saveStatus"></span>
  <div style="display:flex;gap:10px">
    <button class="refresh-btn" onclick="history.back()">Cancelar</button>
    <button class="btn-salvar" id="btnSalvar" onclick="salvar()">💾 Salvar alterações</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="config.js"></script>
<script>
const SESS_KEY  = 'bi_session';
const TOKEN_KEY = 'bi_session_token';
function tokenSessao() { return sessionStorage.getItem(TOKEN_KEY) || ''; }

let _empOriginal = null;

function init() {
  if (sessionStorage.getItem(SESS_KEY) !== 'ok') { window.location.href = 'index.html'; return; }
  const raw = sessionStorage.getItem('bi_edit_lancamento');
  if (!raw) { window.location.href = 'lancamentos.html'; return; }
  try {
    _empOriginal = JSON.parse(raw);
    preencherForm(_empOriginal);
  } catch(e) {
    window.location.href = 'lancamentos.html';
  }
}

function preencherForm(e) {
  document.getElementById('pageTitulo').textContent = e.nomeEmpreendimento || 'Editar Lançamento';
  document.getElementById('pageSub').textContent = [e.construtora, e.bairro, e.cidade].filter(Boolean).join(' · ') || 'Preencha os dados abaixo';

  const campos = ['nomeEmpreendimento','construtora','tipoEmpreendimento','padrao','status',
                  'endereco','bairro','cidade','estado','previsaoEntrega',
                  'estoque','totalUnidades','dataLancamento',
                  'urlSite','foto','lazer','conceito'];
  campos.forEach(c => {
    const el = document.getElementById('f-' + c);
    if (el && e[c] != null) el.value = e[c];
  });

  const unidades = e.unidades && e.unidades.length ? e.unidades : [{}];
  unidades.forEach(u => addUnidade(u));
}

let _uniCount = 0;

function addUnidade(dados = {}) {
  _uniCount++;
  const n = _uniCount;
  const wrap = document.getElementById('unidades-wrap');
  const div = document.createElement('div');
  div.className = 'unidade-wrap';
  div.id = 'uni-' + n;
  div.innerHTML = `
    <div class="unidade-header">
      <span class="unidade-num">Tipologia ${n}</span>
      <button class="btn-rem-uni" onclick="removerUnidade(${n})" title="Remover">×</button>
    </div>
    <div class="form-grid cols3">
      <div class="form-group">
        <label class="form-label">Tipo de produto</label>
        <select class="form-input" id="u${n}-tipo" onchange="aoMudarTipoUnidade(${n})">
          <option value="">Selecionar...</option>
          <option ${dados.tipo==='Apartamento'?'selected':''}>Apartamento</option>
          <option ${dados.tipo==='Casa'?'selected':''}>Casa</option>
          <option ${dados.tipo==='Sobrado'?'selected':''}>Sobrado</option>
          <option ${dados.tipo==='Cobertura'?'selected':''}>Cobertura</option>
          <option ${dados.tipo==='Loft'?'selected':''}>Loft</option>
          <option ${dados.tipo==='Studio'?'selected':''}>Studio</option>
          <option ${dados.tipo==='Terreno'?'selected':''}>Terreno</option>
          <option ${dados.tipo==='Lote Condomínio Horizontal'?'selected':''}>Lote Condomínio Horizontal</option>
          <option ${dados.tipo==='Comercial'?'selected':''}>Comercial</option>
        </select>
      </div>
      <div class="form-group">
        <label class="form-label">Descrição / nome</label>
        <input class="form-input" id="u${n}-unidade" placeholder="Ex: 3 quartos" value="${esc(dados.unidade)}">
      </div>
      <div class="form-group">
        <label class="form-label">Quartos</label>
        <input class="form-input" id="u${n}-quartos" type="number" min="0" placeholder="0" value="${esc(dados.quartos)}">
      </div>
    </div>
    <div class="form-grid cols3">
      <div class="form-group">
        <label class="form-label">Suítes</label>
        <input class="form-input" id="u${n}-suites" type="number" min="0" placeholder="0" value="${esc(dados.suites)}">
      </div>
      <div class="form-group">
        <label class="form-label">Banheiros</label>
        <input class="form-input" id="u${n}-banheiros" type="number" min="0" placeholder="0" value="${esc(dados.banheiros)}">
      </div>
      <div class="form-group">
        <label class="form-label">Vagas</label>
        <input class="form-input" id="u${n}-vagas" type="number" min="0" placeholder="0" value="${esc(dados.vagas)}">
      </div>
    </div>
    <div class="form-grid cols3">
      <div class="form-group">
        <label class="form-label">Escaninho</label>
        <select class="form-input" id="u${n}-escaninho">
          <option value="">—</option>
          <option ${dados.escaninho==='Sim'?'selected':''}>Sim</option>
          <option ${dados.escaninho==='Não'||dados.escaninho==='Nao'?'selected':''}>Não</option>
        </select>
      </div>
    </div>
    <div class="form-grid cols3">
      <div class="form-group">
        <label class="form-label">Qd (quadra)</label>
        <input class="form-input" id="u${n}-qd" placeholder="Ex: 05" value="${esc(dados.qd)}">
      </div>
      <div class="form-group">
        <label class="form-label">Lt (lote)</label>
        <input class="form-input" id="u${n}-lt" placeholder="Ex: 12" value="${esc(dados.lt)}">
      </div>
      <div class="form-group">
        <label class="form-label">Área útil (m²)</label>
        <input class="form-input" id="u${n}-areaUtil" placeholder="Ex: 78" value="${esc(dados.areaUtil)}">
      </div>
    </div>
    <div class="form-grid cols3">
      <div class="form-group">
        <label class="form-label">Área terreno (m²)</label>
        <input class="form-input" id="u${n}-areaTerr" placeholder="Ex: 120" value="${esc(dados.areaTerr)}">
      </div>
      <div class="form-group">
        <label class="form-label">Preço médio (R$)</label>
        <input class="form-input" id="u${n}-precoMedio" placeholder="Ex: 450000" value="${esc(dados.precoMedio)}">
      </div>
      <div class="form-group">
        <label class="form-label">Preço mínimo (R$)</label>
        <input class="form-input" id="u${n}-precoMin" placeholder="Ex: 420000" value="${esc(dados.precoMin)}">
      </div>
    </div>
    <div class="form-grid cols3">
      <div class="form-group">
        <label class="form-label">Preço máximo / tabela (R$)</label>
        <input class="form-input" id="u${n}-precoMax" placeholder="Ex: 480000" value="${esc(dados.precoMax)}">
      </div>
      <div class="form-group">
        <label class="form-label">Preço total (R$)</label>
        <input class="form-input" id="u${n}-precoTotal" placeholder="Ex: 480000" value="${esc(dados.precoTotal)}">
      </div>
      <div class="form-group">
        <label class="form-label">Data da tabela</label>
        <input class="form-input" id="u${n}-dataTabela" placeholder="Ex: 01/06/2026" value="${esc(dados.dataTabela)}">
      </div>
    </div>
    <div style="font-size:10px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.6px;margin:10px 0 2px">Plano de pagamento</div>
    <div class="form-grid cols3">
      <div class="form-group">
        <label class="form-label">Ato / entrada (R$)</label>
        <input class="form-input" id="u${n}-atoEntrada" placeholder="Ex: 20000" value="${esc(dados.atoEntrada)}">
      </div>
      <div class="form-group">
        <label class="form-label">Ato / entrada — qtd</label>
        <input class="form-input" id="u${n}-atoEntradaQtd" type="number" min="0" placeholder="Ex: 1" value="${esc(dados.atoEntradaQtd)}">
      </div>
      <div class="form-group">
        <label class="form-label">Sinal (R$)</label>
        <input class="form-input" id="u${n}-sinal" placeholder="Ex: 5000" value="${esc(dados.sinal)}">
      </div>
    </div>
    <div class="form-grid cols3">
      <div class="form-group">
        <label class="form-label">Sinal — qtd</label>
        <input class="form-input" id="u${n}-sinalQtd" type="number" min="0" placeholder="Ex: 1" value="${esc(dados.sinalQtd)}">
      </div>
      <div class="form-group">
        <label class="form-label">Mensais (R$)</label>
        <input class="form-input" id="u${n}-mensais" placeholder="Ex: 1500" value="${esc(dados.mensais)}">
      </div>
      <div class="form-group">
        <label class="form-label">Mensais — qtd</label>
        <input class="form-input" id="u${n}-mensaisQtd" type="number" min="0" placeholder="Ex: 36" value="${esc(dados.mensaisQtd)}">
      </div>
    </div>
    <div class="form-grid cols3">
      <div class="form-group">
        <label class="form-label">Anuais (R$)</label>
        <input class="form-input" id="u${n}-anuais" placeholder="Ex: 9000" value="${esc(dados.anuais)}">
      </div>
      <div class="form-group">
        <label class="form-label">Anuais — qtd</label>
        <input class="form-input" id="u${n}-anuaisQtd" type="number" min="0" placeholder="Ex: 3" value="${esc(dados.anuaisQtd)}">
      </div>
    </div>`;
  wrap.appendChild(div);
  atualizarNumerosUnidades();
}

function removerUnidade(n) {
  const el = document.getElementById('uni-' + n);
  if (!el) return;
  const total = document.querySelectorAll('#unidades-wrap .unidade-wrap').length;
  if (total <= 1) { toast('Pelo menos uma tipologia é obrigatória.', 'err'); return; }
  el.remove();
  atualizarNumerosUnidades();
}

function atualizarNumerosUnidades() {
  document.querySelectorAll('#unidades-wrap .unidade-wrap').forEach((el, i) => {
    const label = el.querySelector('.unidade-num');
    if (label) label.textContent = 'Tipologia ' + (i + 1);
  });
}

function esc(v) {
  if (v == null || v === false) return '';
  return String(v).replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

function gV(id) {
  const el = document.getElementById(id);
  return el ? el.value.trim() : '';
}

function coletarUnidades() {
  const items = [];
  document.querySelectorAll('#unidades-wrap .unidade-wrap').forEach(div => {
    const id = div.id.replace('uni-', '');
    const qd = gV('u' + id + '-qd');
    const lt = gV('u' + id + '-lt');
    // Qd+Lt juntos representam a "Unidade" em Lote Condomínio Horizontal — se
    // preenchidos, a descrição digitada é ignorada em favor desse formato.
    const unidade = (qd || lt) ? ('Qd ' + qd + ' - Lt ' + lt).trim() : gV('u' + id + '-unidade');
    const precoMax = gV('u' + id + '-precoMax');
    items.push({
      unidade,
      qd, lt,
      tipo:         gV('u' + id + '-tipo'),
      quartos:      gV('u' + id + '-quartos'),
      suites:       gV('u' + id + '-suites'),
      banheiros:    gV('u' + id + '-banheiros'),
      vagas:        gV('u' + id + '-vagas'),
      escaninho:    gV('u' + id + '-escaninho'),
      areaUtil:     gV('u' + id + '-areaUtil'),
      areaTerr:     gV('u' + id + '-areaTerr'),
      precoMedio:   gV('u' + id + '-precoMedio'),
      precoMin:     gV('u' + id + '-precoMin'),
      precoMax,
      // Preço máximo = Preço tabela (Alterações 08/07, item 5a) — não existe
      // mais input separado, o valor manda pros dois campos do backend.
      preco:        precoMax,
      precoTotal:   gV('u' + id + '-precoTotal'),
      dataTabela:   gV('u' + id + '-dataTabela'),
      atoEntrada:   gV('u' + id + '-atoEntrada'),
      atoEntradaQtd:gV('u' + id + '-atoEntradaQtd'),
      sinal:        gV('u' + id + '-sinal'),
      sinalQtd:     gV('u' + id + '-sinalQtd'),
      mensais:      gV('u' + id + '-mensais'),
      mensaisQtd:   gV('u' + id + '-mensaisQtd'),
      anuais:       gV('u' + id + '-anuais'),
      anuaisQtd:    gV('u' + id + '-anuaisQtd'),
    });
  });
  return items;
}

function aoMudarTipoUnidade(n) {
  const tipo = gV('u' + n + '-tipo');
  if (tipo === 'Lote Condomínio Horizontal') {
    document.getElementById('f-padrao').value = 'Médio';
  }
}

async function salvar() {
  const nome = gV('f-nomeEmpreendimento');
  if (!nome) { toast('Nome do empreendimento é obrigatório.', 'err'); return; }

  const unidades = coletarUnidades();
  if (!unidades.length) { toast('Adicione pelo menos uma tipologia.', 'err'); return; }

  const payload = {
    acao: 'salvar_lancamento',
    token: tokenSessao(),
    nomeEmpreendimento: nome,
    construtora:       gV('f-construtora'),
    tipoEmpreendimento: gV('f-tipoEmpreendimento'),
    padrao:            gV('f-padrao'),
    status:            gV('f-status'),
    endereco:          gV('f-endereco'),
    bairro:            gV('f-bairro'),
    cidade:            gV('f-cidade'),
    estado:            gV('f-estado').toUpperCase(),
    previsaoEntrega:   gV('f-previsaoEntrega'),
    estoque:           gV('f-estoque'),
    totalUnidades:     gV('f-totalUnidades'),
    dataLancamento:    gV('f-dataLancamento'),
    urlSite:           gV('f-urlSite'),
    foto:              gV('f-foto'),
    lazer:             gV('f-lazer'),
    conceito:          gV('f-conceito'),
    unidades
  };

  const btn = document.getElementById('btnSalvar');
  const status = document.getElementById('saveStatus');
  btn.disabled = true;
  btn.textContent = 'Salvando...';
  status.textContent = 'Enviando dados...';

  try {
    const resp = await fetch(WEBHOOK_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
      body: new URLSearchParams({ dados: JSON.stringify(payload) })
    });
    const r = await resp.json();
    if (r.ok === false) throw new Error(r.erro || 'Erro desconhecido');
    toast('Lançamento salvo com sucesso!', 'ok');
    status.textContent = 'Salvo ✓';
    setTimeout(() => { window.location.href = 'lancamentos.html'; }, 1200);
  } catch(e) {
    toast('Erro ao salvar: ' + e.message, 'err');
    status.textContent = '';
    btn.disabled = false;
    btn.textContent = '💾 Salvar alterações';
  }
}

function toast(msg, tipo) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.className = 'toast ' + (tipo || '');
  el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), 3500);
}

init();
</script>
